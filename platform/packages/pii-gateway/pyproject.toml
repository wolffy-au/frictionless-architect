[project]
name = "pii-gateway"
description = "PII/PHI anonymization gateway: scrubs content before it reaches an LLM provider (ADR-0014, GH #136)."
# Frozen placeholder, as at the repo root -- versioning moves to the monorepo
# root with the rest of the commitizen setup (ADR-0002, Consequences).
version = "0.0.0"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "presidio-analyzer (>=2.2.0,<3.0.0)",
    "presidio-anonymizer (>=2.2.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "fastapi (>=0.141.0,<0.142.0)",
    "tomli-w (>=1.0.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "pii_gateway", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
