name: CI

permissions:
  contents: read

on:
  # Working branches (feature/**, bugfix/**) are covered by the pull_request
  # trigger; listing them under push too ran the suite twice per PR commit.
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install --upgrade poetry --only-binary ":all:"

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-ubuntu-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-ubuntu-py3.12-

      - name: Install dependencies from the committed lock file
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run pymarkdown lint
        run: poetry run pymarkdownlnt fix ./*.md specs/*.md

      - name: Run ruff for linting
        run: poetry run ruff check .

      - name: Run pyright for static type checking
        run: poetry run pyright

      - name: Run mypy for static type checking
        run: poetry run mypy

      - name: Run behave tests
        run: poetry run behave tests/features/

      - name: Run pytest for unit and integration tests
        run: poetry run pytest --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-root
          path: build/coverage.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml

  platform-test:
    name: platform/ package checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install --upgrade poetry --only-binary ":all:"

      - name: Cache platform virtualenv
        uses: actions/cache@v6
        with:
          path: platform/.venv
          key: platform-venv-ubuntu-py3.12-${{ hashFiles('platform/poetry.lock') }}
          restore-keys: |
            platform-venv-ubuntu-py3.12-

      - name: Cache PlantUML jar
        id: cache-plantuml-jar
        uses: actions/cache@v6
        with:
          path: /usr/share/plantuml/plantuml.jar
          key: plantuml-jar-v1.2026.8

      - name: Install PlantUML
        # modelling-specification's rendering tests shell out to `plantuml`.
        # Same setup as .devcontainer/post-create.sh (apt for the wrapper + Java,
        # then a newer jar), with the jar pinned to the devcontainer's version.
        # The jar itself is cached above; apt still needs to run every time to
        # provide the wrapper script and Java the cached jar depends on.
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml
          if [ "${{ steps.cache-plantuml-jar.outputs.cache-hit }}" != "true" ]; then
            sudo curl -fsSL https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml.jar -o /usr/share/plantuml/plantuml.jar
          fi
          plantuml -version

      - name: Run platform/ package checks
        # One shared lock + venv for platform/ (ADR-0002); pyright, mypy and
        # pytest (90% gate) per package. Writes build/platform-coverage-*.xml.
        run: scripts/platform_checks.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-platform
          path: build/platform-coverage-*.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/platform-coverage-*.xml

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, platform-test]
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          submodules: true

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-xml-*
          path: build
          merge-multiple: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        # SonarCloud's free-tier org plan only reports Quality Gate status for
        # pull requests and the main branch — polling it for a plain push to
        # develop returns 403 ("Organization is not allowed to access data
        # from non main branches"), even though the scan itself succeeds.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
