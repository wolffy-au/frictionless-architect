">HIGH, based on FIPS 199 impact.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="29"><path d="M6,849.297 L6,934.961 A0,0 0 0 0 6,934.961 L227.656,934.961 A0,0 0 0 0 227.656,934.961 L227.656,896.297 L263.27,892.297 L227.656,888.297 L227.656,859.297 L217.656,849.297 L6,849.297 A0,0 0 0 0 6,849.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M217.656,849.297 L217.656,859.297 L227.656,859.297 L217.656,849.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="866.364" fill="#000" font-size="13" textLength="200.656">MongoDB cites the MODERATE</text><text x="12" y="881.497" fill="#000" font-size="13" textLength="163.192">profile directly as its sole</text><text x="12" y="896.629" fill="#000" font-size="13" textLength="159.091">source — a clean single-</text><text x="12" y="911.762" fill="#000" font-size="13" textLength="152.115">dimension example, no</text><text x="12" y="926.895" fill="#000" font-size="13" textLength="109.338">raw-catalog hop.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="37"><path d="M1066.5,207.297 L1066.5,306.797 L1031.05,310.797 L1066.5,314.797 L1066.5,414.023 A0,0 0 0 0 1066.5,414.023 L1303.746,414.023 A0,0 0 0 0 1303.746,414.023 L1303.746,217.297 L1293.746,207.297 L1066.5,207.297 A0,0 0 0 0 1066.5,207.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1293.746,207.297 L1293.746,217.297 L1303.746,217.297 L1293.746,207.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1072.5" y="224.364" fill="#000" font-size="13" textLength="189.674">PRIVACY isn't a 4th exclusive</text><text x="1072.5" y="239.497" fill="#000" font-size="13" textLength="180.642">option — it's an orthogonal,</text><text x="1072.5" y="254.629" fill="#000" font-size="13" textLength="151.855">optional layer on top of</text><text x="1072.5" y="269.762" fill="#000" font-size="13" textLength="206.045">whichever baseline was picked,</text><text x="1072.5" y="284.895" fill="#000" font-size="13" textLength="216.246">used when the system processes</text><text x="1072.5" y="300.028" fill="#000" font-size="13" textLength="19.64">PII.</text><text x="1072.5" y="315.161" fill="#000" font-size="13"> </text><text x="1072.5" y="330.293" fill="#000" font-size="13" textLength="216.214">Real overlap with MODERATE: 43</text><text x="1072.5" y="345.426" fill="#000" font-size="13" textLength="209.663">shared controls, 53 privacy-only</text><text x="1072.5" y="360.559" fill="#000" font-size="13" textLength="196.676">additions — so combining it in</text><text x="1072.5" y="375.692" fill="#000" font-size="13" textLength="174.446">still needs an intermediate</text><text x="1072.5" y="390.825" fill="#000" font-size="13" textLength="180.737">profile, even when only one</text><text x="1072.5" y="405.958" fill="#000" font-size="13" textLength="176.579">source is actually selected.</text></g><!--link catalog to profile--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M531.41,100.427 C473.39,143.437 364.347,224.279 300.277,271.779" style="stroke:#181818;stroke-width:1;" fill="none" id="catalog-to-profile"/><polygon points="296.26,274.757,305.872,272.61,300.277,271.779,301.108,266.184,296.26,274.757" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="495.405" y="143.364" fill="#000" font-size="13" textLength="95.666">import + tailor</text><text x="491.197" y="158.497" fill="#000" font-size="13" textLength="104.083">(select controls,</text><text x="491" y="173.629" fill="#000" font-size="13" textLength="104.476">set parameters)</text></g><!--link catalog to privacy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M604.59,100.427 C659.42,141.077 759.384,215.179 824.724,263.629" style="stroke: