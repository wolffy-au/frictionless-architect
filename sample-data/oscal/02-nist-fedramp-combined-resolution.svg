<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:850px;height:859px;background:#FFFFFF;" width="850px" height="859px" viewBox="0 0 850 859" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="78.546" y="22.995" fill="#000" font-size="14" textLength="686.656" font-weight="700">2. Two dimensions: NIST baseline and FedRAMP baseline combined for one component</text></g><!--entity catalog--><g class="entity" data-qualified-name="catalog" id="ent0001" data-source-line="3"><rect x="199" y="44.297" width="313.855" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="495.855,49.297,495.855,63.297,507.855,63.297,507.855,55.297,501.855,49.297,495.855,49.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="501.855" y1="49.297" x2="501.855" y2="55.297" style="stroke:#181818;stroke-width:0.5;"/><line x1="507.855" y1="55.297" x2="501.855" y2="55.297" style="stroke:#181818;stroke-width:0.5;"/><text x="209" y="70.292" fill="#000" font-size="14" textLength="283.855">NIST/NIST_SP-800-53_rev5_catalog.yaml</text><text x="209" y="86.589" fill="#000" font-size="14" textLength="62.61">(catalog)</text></g><!--entity nist_high--><g class="entity" data-qualified-name="nist_high" id="ent0002" data-source-line="4"><rect x="7" y="177.297" width="316.241" height="71.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="306.241,182.297,306.241,196.297,318.241,196.297,318.241,188.297,312.241,182.297,306.241,182.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="312.241" y1="182.297" x2="312.241" y2="188.297" style="stroke:#181818;stroke-width:0.5;"/><line x1="318.241" y1="188.297" x2="312.241" y2="188.297" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="203.292" fill="#000" font-size="14" textLength="286.241">NIST/NIST_..._HIGH-baseline_profile.yaml</text><text x="17" y="219.589" fill="#000" font-size="14" textLength="149.413">(profile — NIST's own</text><text x="17" y="235.886" fill="#000" font-size="14" textLength="104.583">HIGH baseline)</text></g><!--entity fedramp_high--><g class="entity" data-qualified-name="fedramp_high" id="ent0003" data-source-line="5"><rect x="357.5" y="177.297" width="382.919" height="71.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="723.419,182.297,723.419,196.297,735.419,196.297,735.419,188.297,729.419,182.297,723.419,182.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="729.419" y1="182.297" x2="729.419" y2="188.297" style="stroke:#181818;stroke-width:0.5;"/><line x1="735.419" y1="188.297" x2="729.419" y2="188.297" style="stroke:#181818;stroke-width:0.5;"/><text x="367.5" y="203.292" fill="#000" font-size="14" textLength="352.919">FedRAMP/FedRAMP_..._HIGH-baseline_profile.yaml</text><text x="367.5" y="219.589" fill="#000" font-size="14" textLength="189.896">(profile — FedRAMP's HIGH</text><text x="367.5" y="235.886" fill="#000" font-size="14" textLength="231.793">baseline, tailored independently)</text></g><!--entity combiner--><g class="entity" data-qualified-name="combiner" id="ent0004" data-source-line="6"><rect x="261" y="341.297" width="191.622" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="435.622,346.297,435.622,360.297,447.622,360.297,447.622,352.297,441.622,346.297,435.622,346.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="441.622" y1="346.297" x2="441.622" y2="352.297" style="stroke:#181818;stroke-width:0.5;"/><line x1="447.622" y1="352.297" x2="441.622" y2="352.297" style="stroke:#181818;stroke-width:0.5;"/><text x="271" y="367.292" fill="#000" font-size="14" textLength="161.622">combining-profile.yaml</text><text x="271" y="383.589" fill="#000" font-size="14" textLength="154.137">(profile, imports both)</text></g><!--entity combined--><g class="entity" data-qualified-name="combined" id="ent0005" data-source-line="7"><rect x="227" y="504.297" width="259.585" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="469.585,509.297,469.585,523.297,481.585,523.297,481.585,515.297,475.585,509.297,469.585,509.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="475.585" y1="509.297" x2="475.585" y2="515.297" style="stroke:#181818;stroke-width:0.5;"/><line x1="481.585" y1="515.297" x2="475.585" y2="515.297" style="stroke:#181818;stroke-width:0.5;"/><text x="237" y="530.292" fill="#000" font-size="14" textLength="229.585">combined-resolved-catalog.yaml</text><text x="237" y="546.589" fill="#000" font-size="14" textLength="126.964">(resolved catalog)</text></g><!--entity component--><g class="entity" data-qualified-name="component" id="ent0006" data-source-line="8"><rect x="164.5" y="712.797" width="384.867" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="532.367,717.797,532.367,731.797,544.367,731.797,544.367,723.797,538.367,717.797,532.367,717.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="538.367" y1="717.797" x2="538.367" y2="723.797" style="stroke:#181818;stroke-width:0.5;"/><line x1="544.367" y1="723.797" x2="538.367" y2="723.797" style="stroke:#181818;stroke-width:0.5;"/><text x="174.5" y="738.792" fill="#000" font-size="14" textLength="354.867">example-component-mongodb-fedramp-high.yaml</text><text x="174.5" y="755.089" fill="#000" font-size="14" textLength="132.877">MongoDB (service)</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="20"><path d="M488,326.297 L488,365.297 L453.24,369.297 L488,373.297 L488,411.961 A0,0 0 0 0 488,411.961 L794.346,411.961 A0,0 0 0 0 794.346,411.961 L794.346,336.297 L784.346,326.297 L488,326.297 A0,0 0 0 0 488,326.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M784.346,326.297 L784.346,336.297 L794.346,336.297 L784.346,326.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="494" y="343.364" fill="#000" font-size="13" textLength="219.064">Both profiles tailor the same NIST</text><text x="494" y="358.497" fill="#000" font-size="13" textLength="226.522">catalog, so overlapping control IDs</text><text x="494" y="373.629" fill="#000" font-size="13" textLength="263.593">(e.g. ac-2.3) can collide. merge.combine</text><text x="494" y="388.762" fill="#000" font-size="13" textLength="285.346">method plus explicit modify.set-parameters</text><text x="494" y="403.895" fill="#000" font-size="13" textLength="162.424">decide which value wins.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="28"><path d="M584.5,637.297 L584.5,736.797 L549.7,740.797 L584.5,744.797 L584.5,844.023 A0,0 0 0 0 584.5,844.023 L835.749,844.023 A0,0 0 0 0 835.749,844.023 L835.749,647.297 L825.749,637.297 L584.5,637.297 A0,0 0 0 0 584.5,637.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M825.749,637.297 L825.749,647.297 L835.749,647.297 L825.749,637.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="590.5" y="654.364" fill="#000" font-size="13" textLength="222.93">Two control-implementations, one</text><text x="590.5" y="669.497" fill="#000" font-size="13" textLength="204.509">per source profile, both against</text><text x="590.5" y="684.629" fill="#000" font-size="13" textLength="188.646">control-id ac-2.3 — the same</text><text x="590.5" y="699.762" fill="#000" font-size="13" textLength="188.64">collision the note above calls</text><text x="590.5" y="714.895" fill="#000" font-size="13" textLength="223.514">out. NIST HIGH leaves the disable/</text><text x="590.5" y="730.028" fill="#000" font-size="13" textLength="195.273">inactivity timers organization-</text><text x="590.5" y="745.161" fill="#000" font-size="13" textLength="228.655">defined; FedRAMP HIGH fixes them</text><text x="590.5" y="760.293" fill="#000" font-size="13" textLength="227.741">to 24h/35 days and adds a JAB/AO-</text><text x="590.5" y="775.426" fill="#000" font-size="13" textLength="230.249">approved requirement for non-user</text><text x="590.5" y="790.559" fill="#000" font-size="13" textLength="201.151">and device-identifier accounts.</text><text x="590.5" y="805.692" fill="#000" font-size="13" textLength="194.835">No merged catalog file exists;</text><text x="590.5" y="820.825" fill="#000" font-size="13" textLength="215.033">the component cites both source</text><text x="590.5" y="835.958" fill="#000" font-size="13" textLength="157.212">profiles directly instead.</text></g><!--link catalog to nist_high--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="10" data-link-type="dependency"><path d="M318.72,100.427 C288.65,122.317 250.163,150.315 217.463,174.115" style="stroke:#181818;stroke-width:1;" fill="none" id="catalog-to-nist_high"/><polygon points="213.42,177.057,223.051,174.995,217.463,174.115,218.343,168.527,213.42,177.057" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="279" y="143.364" fill="#000" font-size="13" textLength="95.666">import + tailor</text></g><!--link catalog to fedramp_high--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M393.67,100.427 C424.06,122.317 462.973,150.334 496.013,174.134" style="stroke:#181818;stroke-width:1;" fill="none" id="catalog-to-fedramp_high"/><polygon points="500.07,177.057,495.105,168.551,496.013,174.134,490.429,175.042,500.07,177.057" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="459" y="143.364" fill="#000" font-size="13" textLength="95.666">import + tailor</text></g><!--link nist_high to combiner--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="13" data-link-type="dependency"><path d="M209.05,249.627 C243.81,277.507 287.679,312.699 319.429,338.159" style="stroke:#181818;stroke-width:1;" fill="none" id="nist_high-to-combiner"/><polygon points="323.33,341.287,318.811,332.536,319.429,338.159,313.806,338.777,323.33,341.287" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="268" y="292.364" fill="#000" font-size="13" textLength="66.219">import #1</text></g><!--link fedramp_high to combiner--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="14" data-link-type="dependency"><path d="M504.95,249.627 C470.19,277.507 426.321,312.699 394.571,338.159" style="stroke:#181818;stroke-width:1;" fill="none" id="fedramp_high-to-combiner"/><polygon points="390.67,341.287,400.194,338.777,394.571,338.159,395.189,332.536,390.67,341.287" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="465" y="292.364" fill="#000" font-size="13" textLength="66.219">import #2</text></g><!--link combiner to combined--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="16" data-link-type="dependency"><path d="M357,397.607 C357,427.307 357,469.477 357,499.117" style="stroke:#181818;stroke-width:1;" fill="none" id="combiner-to-combined"/><polygon points="357,504.117,361,495.117,357,499.117,353,495.117,357,504.117" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/>