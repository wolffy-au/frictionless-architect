# Pre-commit framework configuration.
#
# Two stages, mirroring scripts/pre_commit_checks.sh / pre_merge_checks.sh:
#   pre-commit  — fast, autofixing, staged files only
#   pre-push    — the thorough type-check + test suite
#   commit-msg  — Conventional Commits enforcement (commitizen)
#
# Install: pre-commit install --hook-type pre-commit --hook-type pre-push \
#                             --hook-type commit-msg
# See TECHNICAL.md for the tool-by-tool rationale.

repos:
  # ── pre-commit stage: fast, runs on staged files ─────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep two-space markdown line breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      # Run through `poetry run` rather than pinning a separate ruff-pre-commit
      # rev — a standalone rev drifts out of sync with poetry.lock's resolved
      # ruff version, and ruff's isort classification of ambiguous imports
      # (e.g. a same-named local module vs. a third-party package) can differ
      # between versions, so the two ruffs silently disagreed with each other.
      - id: ruff
        name: ruff lint
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: pymarkdown
        name: pymarkdown lint
        entry: poetry run pymarkdownlnt fix
        language: system
        types: [markdown]
        # specs/ and the SpecKit-generated skill docs are managed by tooling
        # and are not ours to reformat. .claude/ skill + agent files are
        # instruction docs (YAML front matter + one long description line) linted
        # by their own conventions, not prose-doc rules. The
        # wiki-librarian-generated wiki/ is likewise tooling-managed.
        exclude: ^(specs/|\.specify/|\.claude/|wiki/|CHANGELOG\.md)
        stages: [pre-commit]

  # ── commit-msg stage: Conventional Commits ───────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9           # matches the pinned commitizen in pyproject.toml
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ── pre-push stage: thorough ────────────────────────────────────────────
  - repo: local
    hooks:
      - id: pyright
        name: pyright type check
        entry: poetry run pyright
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy type check
        entry: poetry run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

      # behave (BDD acceptance) is not gated: tests/features/ holds only a
      # placeholder scenario. Re-add this hook once acceptance-author writes
      # real scenarios. [tool.behave] config and CI's (non-blocking) step stay.

      - id: pytest-unit
        name: pytest unit
        entry: poetry run pytest tests/unit/
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-api
        name: pytest api
        entry: poetry run pytest tests/api/
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-tools
        name: pytest tooling
        entry: poetry run pytest tests/tools/
        language: system
        pass_filenames: false
        stages: [pre-push]
