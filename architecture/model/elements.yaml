# Frictionless Architecture & Governance Platform — model elements
#
# Canonical source of truth. `build.py` projects this + relationships.yaml into
# frictionless-architect.xml (Open Group Exchange Format); every diagram is a
# projection of that. Do not hand-edit the generated XML.
#
# Schema:  type / id / name / desc? / props?
#   type   bare ArchiMate 3.2 concept name (pyArchimate.ArchiType), case-insensitive
#   id     stable kebab id -> deterministic UUID (never renumber a live id)
#   props  str->str; c4 hints, requirement-type, artefact metadata
#
# Sections:
#   A. Motivation + Strategy + Business — the load-bearing skeleton
#   B. Application — the six-subsystem ecosystem (C4 context / container views)
#   C. Application — the artefact input/output pipeline (functions + artefacts)
#
# Authoring note — Assessment wording (not mechanically checked, review by eye):
#   An Assessment's `name` must be written in the vocabulary of the Stakeholder
#   who holds its Driver, not in architecture/implementation jargon. A board
#   stakeholder reasons about market position and revenue risk, not "manual
#   architecture governance" — push the technical cause into `desc` instead of
#   the headline. (`build.py`'s `check_motivation_conventions` catches
#   structural mistakes — a Driver bypassing its Assessment, a derived
#   Constraint/Requirement->Goal edge — but altitude-of-language like this is a
#   judgement call, not a graph check.)

# =====================================================================
# A. MOTIVATION — Drivers (why the platform exists)
# =====================================================================
- type: Driver
  id: driver-agility
  name: Market Agility & Competitive Pressure
  desc: >-
    In an AI-driven landscape the "cost of delay" is existential. If the bank
    cannot deliver features as fast as a startup or a tech giant, it loses
    market share.
- type: Driver
  id: driver-compliance
  name: Regulatory Resiliency & Social License
  desc: >-
    For a major financial institution, non-compliance with APRA CPS 230/234 is a
    threat to the banking license. Manual compliance is too slow and error-prone
    for an AI-speed world.
- type: Driver
  id: driver-sustainability
  name: Systemic Sustainability & Complexity Management
  desc: >-
    Unmanaged architectural drift creates hidden debt that makes systems
    fragile. Left unchecked, the system eventually becomes too complex to change
    at any speed.
- type: Driver
  id: driver-scaling
  name: Human-to-Machine Operational Scaling
  desc: >-
    Human architects are a finite bottleneck. As AI agents produce changes at
    machine speed, it is physically impossible to review it all with traditional
    methods.

# =====================================================================
# A. MOTIVATION — Stakeholders (who holds the drivers) and Assessments
#    (the analysis of the current situation that makes each driver urgent).
#    Stakeholder viewpoint: stakeholders -> drivers -> goal/outcome.
# =====================================================================
- type: Stakeholder
  id: stk-exec
  name: Executive Leadership & Board
  desc: >-
    Accountable for the banking licence, market position and the enterprise
    risk appetite. Holds the agility and compliance drivers.
- type: Stakeholder
  id: stk-regulator
  name: Prudential Regulator (APRA)
  desc: >-
    External stakeholder. Requires demonstrable, continuous compliance with
    CPS 230/234 and sound model risk management.
- type: Stakeholder
  id: stk-architecture
  name: Enterprise Architecture Function
  desc: >-
    Owns architectural coherence and the target state; carries the
    sustainability and complexity-management concern.
- type: Stakeholder
  id: stk-delivery
  name: Delivery Organisation
  desc: >-
    Human engineers and AI delivery agents producing change at machine speed;
    holds the operational-scaling concern.
- type: Stakeholder
  id: stk-risk-compliance
  name: Risk & Compliance Function
  desc: >-
    Second-line assurance. Needs provable, auditable control effectiveness
    rather than after-the-fact manual evidence.

- type: Assessment
  id: assess-time-to-market
  name: Time-to-market is falling behind AI-native competitors, risking market share
  desc: >-
    AI-native challengers ship customer-facing features in days; our
    human-gated change process takes weeks. Every release cycle the gap
    persists is a release cycle of lost competitive ground and revenue at
    risk — a board-level concern, independent of the architectural cause.
- type: Assessment
  id: assess-review-bottleneck
  name: Human review cannot keep pace with AI-speed delivery
  desc: >-
    Change volume from AI agents already exceeds what human architects and
    reviewers can inspect; the gap widens monthly.
- type: Assessment
  id: assess-drift-debt
  name: Architectural drift is accumulating as unmanaged risk
  desc: >-
    As-built systems diverge from intent with no systematic detection; hidden
    architectural debt is compounding.
- type: Assessment
  id: assess-manual-compliance
  name: Manual compliance evidence is too slow and error-prone
  desc: >-
    Control mapping and evidence collection are manual, lag delivery by weeks,
    and cannot be trusted at AI-delivery cadence.

# =====================================================================
# A. MOTIVATION — Goal & Outcome (the aim, and the end result that realizes it)
#    Drivers influence the goal; the Governed Architecture Delivery value
#    stream realizes the outcome; the outcome realizes the goal.
# =====================================================================
- type: Goal
  id: goal-frictionless-architecture
  name: Frictionless Architecture & Governance at Machine Speed
  desc: >-
    Sustain architecturally-sound, provably-compliant change at the speed and
    volume of AI-driven delivery — without a human review bottleneck and
    without accumulating unmanaged architectural drift.
- type: Outcome
  id: outcome-executable-intelligence
  name: Architecture as Executable Intelligence
  desc: >-
    Architecture has moved from passive documentation to executable system
    intelligence: the specification, the controls, and the guardrails are
    machine-readable artefacts that AI agents and pipelines consume directly.

# =====================================================================
# A. MOTIVATION — Principles (constitution-level; cross-binding)
# =====================================================================
- type: Principle
  id: principle-human-accountability
  name: Deterministic Human Accountability
  desc: AI is advisory; the specification is deterministic; a human holds sign-off.
- type: Principle
  id: principle-forensic-audit
  name: Forensic Auditability
  desc: >-
    Ability to reconstruct not just what happened but why a decision was made.
- type: Principle
  id: principle-policy-as-code
  name: Policy as Code
  desc: >-
    All governance rules, compliance mappings, and architectural guardrails are
    expressed as version-controlled, machine-executable policy, not prose
    documents.

# =====================================================================
# A. MOTIVATION — Constraints (regulatory envelope every component inherits)
# =====================================================================
- type: Constraint
  id: const-apra
  name: No Retrospective Compliance (APRA CPS 230/234)
  desc: >-
    The platform must never let a change reach production on a promise to
    check compliance later — every change requires a resolved, evidenced
    obligation mapping before the deployment gate, and continuous
    as-built/as-designed evidence afterward. Retrospective flagging does not
    satisfy APRA's continuous-assurance expectation.
- type: Constraint
  id: const-model-risk
  name: No Autonomous Self-Validation of Agentic Decisions
  desc: >-
    The platform must not allow an AI agent to validate or approve its own
    agentic decision-making. Wherever SR 11-7 / APRA model-risk obligations
    apply, validation must be independent of the agent that produced the
    change, and every validation outcome must be documented as evidence, not
    inferred after the fact.
- type: Constraint
  id: const-privacy
  name: Privacy Mapping Is Mandatory, Not an Out-of-Band Check
  desc: >-
    Any change touching personal information must be automatically mapped to
    its Australian Privacy Act (APP) obligations before the deployment gate,
    and the control catalog must carry APP requirements as machine-readable
    entries the mapping checks against — privacy may never be handled as a
    manual, out-of-band review step.
- type: Constraint
  id: const-cloud-policy
  name: Governed State Confined to Approved Sovereignty Boundary
  desc: >-
    The knowledge graph, audit ledger and control catalog must be hosted,
    processed and reconciled only within approved, in-jurisdiction cloud
    environments. No platform component may source, replicate or reconcile
    governed system state through infrastructure outside that boundary.

# =====================================================================
# A. MOTIVATION — Functional Requirements (each one is a component contract)
# =====================================================================
- type: Requirement
  id: req-auto-spec-generation
  name: Automated Specification Generation from Graph
  desc: >-
    For every approved change request, the system must automatically derive a
    complete, executable architectural specification from the knowledge graph —
    with zero manual authoring by an architect.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-regulatory-mapping
  name: Automated Regulatory Obligation Mapping
  desc: >-
    Every technical change must be automatically mapped to its applicable APRA
    CPS 230/234 obligations before a deployment gate is passed. No change may
    proceed without a resolved compliance mapping.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-pre-deploy-gate
  name: Pre-Deployment Compliance Gate Enforcement
  desc: >-
    The supervisory control plane must intercept and evaluate all
    agent-generated changes against the executable specification before they
    reach any test or production environment. Non-compliant changes must be
    blocked, not flagged retrospectively.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-continuous-reconciliation
  name: Continuous As-Built vs. As-Designed Reconciliation
  desc: >-
    The system must continuously reconcile observed system state (telemetry,
    deployed artefacts) against the knowledge graph's as-designed intent and
    surface any deviation as a classified drift event.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-human-signoff
  name: Mandatory Human Sign-off for Non-Standard Changes
  desc: >-
    Any change that cannot be deterministically validated against the executable
    specification must be escalated to a named human architect for explicit
    approval. The system must prevent autonomous resolution of ambiguous
    compliance cases.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-control-catalog
  name: Maintained Machine-Readable Control Catalog
  desc: >-
    The platform must maintain the full set of applicable regulatory obligations,
    policies and standards as version-controlled, machine-readable control
    definitions (OSCAL Catalogs and Profiles), kept synchronised with upstream
    regulatory content sources.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-reusable-architecture
  name: Curated Reusable Architecture Library
  desc: >-
    The platform must maintain a curated library of technology-agnostic
    architecture patterns, implementation blueprints and composed solution
    designs — each mapped to its applicable controls and threat model — as the
    reuse basis for all new solution architecture and specification generation.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-authoritative-twin
  name: Authoritative Digital Twin of System State
  desc: >-
    The platform must maintain a live, queryable graph of enterprise technology
    state — an intent plane and an as-built digital twin plane — as the single
    authoritative source of architectural truth that every other capability
    reads from.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-immutable-audit-ledger
  name: Immutable Forensic Audit Ledger
  desc: >-
    Every agent action, gate decision, specification evaluation and governed
    state transition must be recorded to an append-only, queryable ledger
    usable as contemporaneous evidence for regulatory examination.
  props:
    requirement-type: Functional

# =====================================================================
# A. STRATEGY — Primary Capabilities
#    Named as abilities, not the artefact they own. Each is realized by one
#    subsystem (section B) and realizes at least one functional requirement.
# =====================================================================
- type: Capability
  id: cap-digital-twin
  name: Architecture Knowledge Management
  desc: >-
    Maintain a live, queryable graph of the enterprise technology landscape —
    its components, policies, relationships, and regulatory mappings, across an
    intent plane and an as-built twin plane — as the authoritative source of
    architectural truth.
- type: Capability
  id: cap-spec-engine
  name: Executable Specification Generation
  desc: >-
    Deterministically produce machine-consumable architectural specifications
    from the knowledge graph, which AI agents and CI/CD pipelines consume as
    guardrails rather than human-readable documents.
- type: Capability
  id: cap-control-plane
  name: Agentic Development Supervision
  desc: >-
    Constrain, monitor, and intervene in the behaviour of autonomous development
    agents in real time, enforcing architectural and regulatory boundaries
    before code reaches any environment.
- type: Capability
  id: cap-forensic-ledger
  name: Forensic Audit Recording
  desc: >-
    Record every agent action, gate decision, and specification evaluation into
    an immutable, queryable ledger that serves as contemporaneous evidence for
    regulatory examination.
- type: Capability
  id: cap-drift-dashboard
  name: Architectural Drift Detection & Reconciliation
  desc: >-
    Continuously compare observed system telemetry against the as-designed
    knowledge graph and surface deviations — strategic, structural, or agentic —
    in real time.
- type: Capability
  id: cap-human-approval-workflow
  name: Human Oversight & Approval
  desc: >-
    Identify, route, and manage human architect approval for changes that
    deviate from deterministic specifications or present ambiguous compliance
    scenarios, through a defined, auditable sign-off process that upholds
    deterministic human accountability.
- type: Capability
  id: cap-control-catalog
  name: Control & Obligation Management
  desc: >-
    Maintain the authoritative, version-controlled library of control and
    compliance content — external regulatory obligations and the
    organisation's own policies, standards and controls alike — as OSCAL
    Catalogs and Profiles kept synchronised with upstream regulatory sources,
    and map every governed change to its applicable obligations.
- type: Capability
  id: cap-reusable-architecture
  name: Reusable Architecture Curation
  desc: >-
    Curate technology-agnostic architecture patterns, implementation blueprints
    and composed solution designs — with control mappings and threat models — as
    the reusable basis for new solution architecture and specification
    generation, and model candidate and future-state architecture options for
    governance decisions.

# =====================================================================
# A. STRATEGY — Courses of action (the strategic initiatives the capabilities
#    are being built to realize) and Resources (the assets behind them).
#    Strategy viewpoint: resources -> capabilities -> courses of action.
# =====================================================================
- type: CourseOfAction
  id: coa-executable-governance
  name: Shift Governance Into the Pipeline
  desc: >-
    Replace document-and-meeting governance with machine-readable
    specifications, controls and enforcement gates that run inline with
    delivery.
- type: CourseOfAction
  id: coa-living-twin
  name: Operate a Living Architecture Twin
  desc: >-
    Maintain an authoritative, continuously-reconciled model of intended and
    actual architecture as the single source both humans and agents work from.
- type: CourseOfAction
  id: coa-reuse-first
  name: Curate Reuse Before Build
  desc: >-
    Make curated patterns, blueprints and control mappings the default
    starting point for every change, rather than bespoke design.

- type: Resource
  id: res-akg
  name: Architecture Knowledge Graph
  desc: Intangible resource — the graph of intent, controls, patterns and as-built state.
- type: Resource
  id: res-ai-agents
  name: AI Delivery Agents
  desc: Human-equivalent resource — the agentic crew that produces change at machine speed.
- type: Resource
  id: res-control-content
  name: OSCAL Control Content
  desc: Intangible resource — the machine-readable regulatory and control corpus.
- type: Resource
  id: res-ea-practice
  name: Enterprise Architecture Practice
  desc: Human resource — the architects who curate patterns and hold governance decisions.

# =====================================================================
# A. STRATEGY — Value stream (outcome-oriented view of governed delivery;
#    each stage is served by the capabilities that enable it)
# =====================================================================
- type: ValueStream
  id: vs-governed-delivery
  name: Governed Architecture Delivery
  desc: >-
    End-to-end value stream that turns an approved change into a compliant,
    twin-reconciled production release: baseline, specify, build, prove,
    release, reconcile.
- type: ValueStream
  id: vss-baseline
  name: Establish Control & Reuse Baseline
  desc: >-
    Curated controls, obligations, patterns and blueprints are in place to
    build the change against.
- type: ValueStream
  id: vss-specify
  name: Specify the Change
  desc: >-
    A deterministic, executable specification is derived from the knowledge
    graph for the approved change.
- type: ValueStream
  id: vss-build
  name: Build Under Supervision
  desc: >-
    Development agents produce code, tests and manifests within enforced
    architectural and regulatory boundaries.
- type: ValueStream
  id: vss-prove
  name: Prove Compliance
  desc: >-
    The release candidate is evaluated against the specification and the
    expected controls; non-compliant changes are blocked, not flagged later.
- type: ValueStream
  id: vss-release
  name: Release & Attest
  desc: >-
    A compliant release is deployed, human sign-off is captured where required,
    and every decision is recorded to the forensic ledger.
- type: ValueStream
  id: vss-reconcile
  name: Reconcile & Remediate
  desc: >-
    Observed state is continuously reconciled against intent and classified
    drift is routed to remediation.

# =====================================================================
# A. BUSINESS — Processes (the orchestration choreography between components)
# =====================================================================
- type: BusinessProcess
  id: process-spec-generation
  name: Deterministic Spec Generation
  desc: >-
    Scripted, template-driven generation of executable architectural
    specifications from the knowledge graph. AI recommends scope; human holds
    sign-off. Output is the deterministic intent consumed by the agentic crew.
- type: BusinessProcess
  id: process-agentic-crew
  name: Agentic Development Execution
  desc: >-
    Supervised execution of AI-driven development within supervisory control
    plane constraints. Consumes the executable specification, regulation,
    policy, patterns, and controls from the knowledge graph to generate code,
    test suites, and deployment manifests.
- type: BusinessProcess
  id: process-cicd-pipeline
  name: Automated CICD Gate Execution
  desc: >-
    The CI/CD pipeline with the agentic control plane woven in. Evaluates every
    artefact against the executable specification and policy-as-code gates
    before a release is permitted. Blocks on violation; escalates exceptions for
    human review; logs all gate outcomes to the immutable ledger.
- type: BusinessProcess
  id: process-release
  name: Production Release
  desc: >-
    Compliant, traceable-to-spec deployment to production, triggered only after
    all gates have cleared. Automatically auditable end-to-end.
- type: BusinessProcess
  id: process-state-discovery
  name: Current State Discovery
  desc: >-
    Continuous, automated reconciliation of actual system state against
    architectural intent. Surfaces classified drift events for human review;
    does not write directly to the backlog.
- type: BusinessProcess
  id: process-drift-review
  name: Drift Review & Triage Gate
  desc: >-
    Human-gated review of drift findings before they are committed as backlog
    work items. A Solution Architect approves architectural drift; Security &
    Compliance approves regulatory drift. Ensures only validated, prioritised
    findings enter the delivery pipeline.
- type: BusinessProcess
  id: process-policy-authoring
  name: Policy & Standards Authoring
  desc: >-
    The Compliance Officer / Auditor authors custom policy and standard
    content, informed by upstream regulatory standards. Realized at
    application layer by fn-policy-authoring (authored as Trestle Markdown).
- type: BusinessProcess
  id: process-oscal-conversion
  name: OSCAL Catalog & Profile Generation
  desc: >-
    Converts authored policy content and upstream regulatory standards into
    OSCAL Catalogs and Profiles. Realized at application layer by
    fn-oscal-conversion via a Trestle round-trip.
- type: BusinessProcess
  id: process-pattern-traceability
  name: Pattern Control Traceability Mapping
  desc: >-
    The Enterprise Architect maps generated OSCAL Profile controls onto
    architecture patterns to capture controls traceability. Realized at
    application layer by fn-pattern-authoring.
- type: BusinessProcess
  id: process-blueprint-traceability
  name: Blueprint Control Enablement Mapping
  desc: >-
    The Solution Architect derives technology-specific implementation
    blueprints from a technology-agnostic architecture pattern, capturing
    control enablement status and gaps against the OSCAL Profile. Realized at
    application layer by fn-blueprint-authoring.
- type: BusinessProcess
  id: process-effectiveness-monitoring
  name: Controls Effectiveness Monitoring
  desc: >-
    Platform Operations watches whether deployed controls remain effective in
    BAU, against the same SSP the release gate checked. Realized at
    application layer by fn-effectiveness-monitor.

# =====================================================================
# A. BUSINESS — Objects (business-layer counterparts of the artefacts in
#    section C; Realization links tie each back to its DataObject)
# =====================================================================
- type: BusinessObject
  id: bo-regulatory-standard
  name: Regulatory Standard
  desc: >-
    Upstream regulatory content consumed by the platform (e.g. NIST OSCAL
    catalogs, FedRAMP baselines).
- type: BusinessObject
  id: bo-policy-doc
  name: Policy / Standard Document
  desc: Custom policy or standard authored by the Compliance Officer / Auditor.
- type: BusinessObject
  id: bo-oscal-catalog
  name: OSCAL Catalog
  desc: Machine-readable control catalog.
- type: BusinessObject
  id: bo-oscal-profile
  name: OSCAL Profile
  desc: Tailored control selection / baseline.
- type: BusinessObject
  id: bo-architecture-pattern
  name: Architecture Pattern
  desc: Technology-agnostic, reusable design with mapped controls.
- type: BusinessObject
  id: bo-implementation-blueprint
  name: Implementation Blueprint
  desc: >-
    Technology-specific realisation of an architecture pattern, capturing
    control enablement status and gaps.
- type: BusinessObject
  id: bo-oscal-component
  name: OSCAL Component Definition
  desc: Control implementation claims for a reusable blueprint.
- type: BusinessObject
  id: bo-solution-component
  name: Solution Component
  desc: >-
    A deployed instance of an Implementation Blueprint, specialized for one
    technology and bound into a specific Solution Design.
- type: BusinessObject
  id: bo-solution-design
  name: Solution Design
  desc: >-
    Solution-specific composition of Solution Components, unique to one
    system, closely related to its discovered configuration items.
- type: BusinessObject
  id: bo-oscal-ssp
  name: OSCAL System Security Plan
  desc: >-
    Control implementation for the specific Solution Design it is derived
    from — reconciled against discovered configuration items via the
    existing state-discovery mechanism, not a separate one.
- type: BusinessObject
  id: bo-oscal-assessment-results
  name: OSCAL Assessment Results
  desc: >-
    Findings on whether the SSP's declared control implementations are
    satisfied. Verified at two cadences — a pre-release gate check and
    continuous BAU monitoring — each a specialised instance of this.
- type: BusinessObject
  id: bo-release-gate-decision
  name: Release Gate Decision
  desc: Pass / block outcome with the controls evaluated at release time.
- type: BusinessObject
  id: bo-control-effectiveness-evidence
  name: Control Effectiveness Evidence
  desc: BAU evidence that a deployed control is (or is not) working.

# =====================================================================
# B. APPLICATION — the platform and its six subsystems
#    (c4=system on the Grouping -> C4 System_Boundary; the ApplicationComponents
#     it composes -> C4 Containers; each subsystem's fine-grained functions are
#     the section-C ApplicationFunctions Assignment-linked to it)
# =====================================================================
- type: Grouping
  id: sys-platform
  name: Frictionless Architecture Platform
  desc: Governs architecture from authored policy through to BAU control effectiveness.
  props:
    c4: system
- type: ApplicationComponent
  id: sub-catalog
  name: Controls & Compliance Catalog
  desc: >-
    Authors custom policies and standards and converts them to OSCAL Catalogs
    and Profiles.
- type: ApplicationComponent
  id: sub-library
  name: Reusable Architecture Library
  desc: >-
    Composable patterns, blueprints and solution designs with OSCAL references,
    threat modelling, and modelling of candidate / future-state options for
    governance to decide on.
- type: ApplicationComponent
  id: sub-twin
  name: Digital Twin & Knowledge Graph
  desc: >-
    Maintains the Architecture Knowledge Graph: an intent plane and a
    current-state digital twin plane.
- type: ApplicationComponent
  id: sub-governance
  name: Architecture Governance
  desc: >-
    Comparative evaluation of candidate options, impact assessment, the decision
    and its ADR, and archival of the rejected options with reasons. Pure
    decision-making — the options themselves are modelled in the Reusable
    Architecture Library.
- type: ApplicationComponent
  id: sub-assurance
  name: Conformance & Drift Assurance
  desc: >-
    Enforces controls at release, monitors effectiveness in BAU, and detects and
    reports architecture drift.
- type: ApplicationComponent
  id: sub-modelling
  name: Modelling & Specification
  desc: >-
    Out-of-the-box ArchiMate / C4 / UML modelling, and generation of development
    specifications.

# --- B. Shared stores (DataObject composed by the platform -> C4 ContainerDb) ---
- type: DataObject
  id: store-oscal
  name: OSCAL Repository
  desc: OSCAL Catalogs, Profiles, Components, SSPs and Assessment Results.
- type: DataObject
  id: store-patterns
  name: Pattern & Blueprint Repository
  desc: Architecture patterns, implementation blueprints and solution designs.
- type: DataObject
  id: store-akg
  name: Architecture Knowledge Graph
  desc: "One graph store, two planes: Architecture Intent and Current-State Digital Twin."
- type: DataObject
  id: store-frameworks
  name: Framework Pack Library
  desc: NIST / FedRAMP baselines; ArchiMate / C4 / UML metamodels.
- type: DataObject
  id: store-ledger
  name: Forensic Audit Ledger
  desc: >-
    Append-only, immutable record of agent actions, gate decisions,
    specification evaluations and governed state transitions, kept as
    contemporaneous evidence for regulatory examination.

# --- B. People (BusinessRole -> C4 Person) ---
- type: BusinessRole
  id: role-ea
  name: Enterprise Architect
  desc: Owns principles, target patterns, options and governance decisions.
- type: BusinessRole
  id: role-sa
  name: Solution Architect
  desc: Composes blueprints into solution designs.
- type: BusinessRole
  id: role-sec
  name: Security Architect / Threat Modeller
  desc: Runs threat models over patterns, blueprints and designs.
- type: BusinessRole
  id: role-dev
  name: Developer
  desc: Consumes generated specifications for delivery.
- type: BusinessRole
  id: role-compliance
  name: Compliance Officer / Auditor
  desc: Authors control content and verifies traceability.
- type: BusinessRole
  id: role-ops
  name: Platform Operations (BAU)
  desc: Watches control effectiveness and drift in run.

# --- B. External systems (ApplicationComponent outside the Grouping -> C4 System_Ext) ---
- type: ApplicationComponent
  id: ext-scm
  name: Source Control
  desc: Git repositories for specifications and delivery code.
- type: ApplicationComponent
  id: ext-cicd
  name: CI/CD Pipeline
  desc: Builds, tests and releases; invokes the enforcement gate.
- type: ApplicationComponent
  id: ext-cloud
  name: Cloud & Infrastructure Platforms
  desc: Runtime platforms whose live state feeds the digital twin.
- type: ApplicationComponent
  id: ext-itsm
  name: IT Service Management / Backlog
  desc: Delivery backlog and ticketing (e.g. Jira).
- type: ApplicationComponent
  id: ext-regsources
  name: Regulatory Content Sources
  desc: Upstream NIST OSCAL content and FedRAMP baselines.
- type: ApplicationComponent
  id: ext-llm
  name: LLM Provider
  desc: Language model used for drafting specs, ADRs, evaluations and threat narratives.
- type: ApplicationComponent
  id: ext-rfp
  name: RFP / Vendor Submissions
  desc: >-
    Requests for proposal and competing vendor solution responses assessed at
    engagement time.

# =====================================================================
# C. APPLICATION — the artefact input/output pipeline
#    ApplicationFunctions (the generators/transformers) assigned to their
#    subsystem, reading input artefacts and writing output artefacts via Access.
#    Artefacts are DataObjects, aggregated into the shared stores from section B.
# =====================================================================

# --- C. Functions: Controls & Compliance Catalog ---
- type: ApplicationFunction
  id: fn-policy-authoring
  name: Policy & Standards Authoring
  desc: Author custom policy and standard content as Trestle Markdown catalogs.
- type: ApplicationFunction
  id: fn-oscal-conversion
  name: OSCAL Catalog & Profile Generation
  desc: >-
    Convert authored Markdown and upstream baselines into OSCAL Catalogs and
    Profiles (Trestle round-trip).

# --- C. Functions: Reusable Architecture Library ---
- type: ApplicationFunction
  id: fn-pattern-authoring
  name: Pattern Authoring & Control Mapping
  desc: >-
    Author technology-agnostic architecture patterns and map them to OSCAL
    Profiles.
- type: ApplicationFunction
  id: fn-blueprint-authoring
  name: Blueprint Authoring & Component Mapping
  desc: >-
    Derive implementation blueprints from patterns and map them to OSCAL
    Component Definitions.
- type: ApplicationFunction
  id: fn-solution-compose
  name: Solution Design Composition
  desc: >-
    Compose blueprints and patterns into a solution design and emit its OSCAL
    System Security Plan.
- type: ApplicationFunction
  id: fn-threat-model
  name: Threat Modelling
  desc: >-
    Attach threats and mitigations to patterns, blueprints and solution
    designs.
- type: ApplicationFunction
  id: fn-options-model
  name: Future-State & Options Modelling
  desc: >-
    Model one or more candidate future-state architectures, including competing
    vendor / RFP responses, as decision input for Architecture Governance.

# --- C. Functions: Digital Twin & Knowledge Graph ---
- type: ApplicationFunction
  id: fn-twin-ingest
  name: Digital Twin Ingestion
  desc: >-
    Build the current-state digital twin plane from live infrastructure state
    and deployment events.
- type: ApplicationFunction
  id: fn-ledger-record
  name: Forensic Ledger Recording
  desc: >-
    Append every agent action, gate decision, specification evaluation and
    governed state transition to the append-only Forensic Audit Ledger as
    contemporaneous evidence for regulatory examination.

# --- C. Functions: Architecture Governance ---
- type: ApplicationFunction
  id: fn-governance-eval
  name: Comparative Evaluation & Decision
  desc: >-
    Compare candidate options, assess impact against intent and twin, record the
    ADR, and archive rejected options with rationale.

# --- C. Functions: Conformance & Drift Assurance ---
- type: ApplicationFunction
  id: fn-enforcement-gate
  name: Controls Enforcement Gate
  desc: >-
    Evaluate a release candidate against the expected controls and the solution
    design at release time; block or pass.
- type: ApplicationFunction
  id: fn-effectiveness-monitor
  name: Controls Effectiveness Monitoring
  desc: >-
    Monitor whether deployed controls remain effective in BAU and record the
    evidence.
- type: ApplicationFunction
  id: fn-drift-engine
  name: Drift & Deviation Detection
  desc: >-
    Diff as-designed intent against the current-state twin and classify
    deviations as drift findings.

# --- C. Functions: Modelling & Specification ---
- type: ApplicationFunction
  id: fn-notation-engine
  name: Modelling & Notation Rendering
  desc: Render ArchiMate / C4 / UML models against the bundled metamodels.
- type: ApplicationFunction
  id: fn-spec-generator
  name: Specification Generation
  desc: >-
    Generate development specifications from patterns, blueprints and solution
    designs for spec-driven delivery.

# --- C. Artefacts (DataObject) ---
- {type: DataObject, id: art-policy-doc, name: Policy / Standard Document, desc: Custom policy or standard authored as Trestle Markdown.}
- {type: DataObject, id: art-baseline, name: Regulatory Baseline Catalog, desc: Upstream NIST OSCAL catalog / FedRAMP baseline.}
- {type: DataObject, id: art-oscal-catalog, name: OSCAL Catalog, desc: Machine-readable control catalog.}
- {type: DataObject, id: art-oscal-profile, name: OSCAL Profile, desc: Tailored control selection / baseline.}
- {type: DataObject, id: art-oscal-component, name: OSCAL Component Definition, desc: Control implementation claims for a reusable component.}
- {type: DataObject, id: art-oscal-ssp, name: OSCAL System Security Plan, desc: Control implementation for a specific solution design.}
- {type: DataObject, id: art-pattern, name: Architecture Pattern, desc: Technology-agnostic, reusable design with mapped controls.}
- {type: DataObject, id: art-blueprint, name: Implementation Blueprint, desc: Technology-specific realisation of one or more patterns.}
- {type: DataObject, id: art-solution-design, name: Solution Design, desc: Composed solution — SolutionComponents under a SolutionDesign.}
- {type: DataObject, id: art-threat-model, name: Threat Model, desc: Threats and mitigations attached to a pattern, blueprint or design.}
- {type: DataObject, id: art-infra-state, name: Live Infrastructure State, desc: Observed configuration of the running platforms.}
- {type: DataObject, id: art-deploy-event, name: Deployment Event, desc: A release / deployment recorded by the pipeline.}
- {type: DataObject, id: art-twin, name: Current-State Digital Twin, desc: The as-built plane of the Architecture Knowledge Graph.}
- {type: DataObject, id: art-candidate-arch, name: Candidate Architecture Option, desc: A proposed future-state or vendor solution under evaluation.}
- {type: DataObject, id: art-adr, name: Architecture Decision Record, desc: The chosen option with its rationale and trade-offs.}
- {type: DataObject, id: art-impact-assessment, name: Impact Assessment, desc: Effect of a candidate option on intent and current state.}
- {type: DataObject, id: art-archived-option, name: Archived Rejected Option, desc: A not-chosen option retained with the reasons it lost.}
- {type: DataObject, id: art-release-candidate, name: Release Candidate, desc: A build submitted to the enforcement gate.}
- {type: DataObject, id: art-oscal-ar, name: OSCAL Assessment Results, desc: Findings on whether an SSP's declared control implementations are satisfied.}
- {type: DataObject, id: art-gate-decision, name: Gate Decision, desc: Pass / block outcome with the controls evaluated — the pre-release instance of an OSCAL Assessment Results.}
- {type: DataObject, id: art-effectiveness-evidence, name: Control Effectiveness Evidence, desc: BAU evidence that a control is (or is not) working — the continuous-monitoring instance of an OSCAL Assessment Results.}
- {type: DataObject, id: art-drift-report, name: Classified Drift Finding, desc: A deviation of current state from intent, classified and prioritised.}
- {type: DataObject, id: art-remediation-item, name: Remediation Backlog Item, desc: A drift finding promoted to actionable delivery work.}
- {type: DataObject, id: art-dev-spec, name: Development Specification, desc: Executable spec derived from patterns, blueprints and designs.}
- {type: DataObject, id: art-metamodel, name: Notation Metamodel, desc: ArchiMate / C4 / UML metamodel used to constrain modelling.}
- {type: DataObject, id: art-ledger-entry, name: Ledger Entry, desc: A single immutable forensic record — actor, action, target artefact, timestamp, outcome.}

# =====================================================================
# D. IT4IT ALIGNMENT — the IT4IT 3.0 value-stream skeleton, sourced from the
#    Open Group's own reference model (it4it-fixed.xml): the root "IT4IT
#    Value Streams" wrapper, its 7 value streams (a Flow network, not a
#    pipeline), their 28 stages, and the one Outcome the root realizes.
#    Lightweight traceability only — not the platform's own model. Tagged
#    `props: {source: it4it}` and id-prefixed `it4it-` so they can be
#    grepped/filtered/hidden independently of everything above. Not
#    referenced by any existing view — see view-it4it-alignment in
#    views.yaml. Deliberately left unconnected to this platform's own
#    capabilities for now (props: {source: it4it} marks every element that
#    would need a bridge relationship added later).
# =====================================================================
- {type: ValueStream, id: it4it-vs-root, name: "IT4IT: Value Streams", desc: The root wrapper composing all 7 IT4IT value streams., props: {source: it4it}}
- {type: Outcome, id: it4it-outcome-digital-product, name: "IT4IT: Digital Product", props: {source: it4it}}

- type: ValueStream
  id: it4it-vs-explore
  name: "IT4IT: Explore"
  desc: >-
    The value stream "Explore" is performed on the Scope Agreements developed in
    the Evaluate value stream. It ensures that all planned and accepted Portfolio
    Backlog Items are further detailed, budgeted, and sourced for Digital
    Products. This value stream continuously explores new features and/or future
    directions of a Digital Product aligned with strategic direction and business
    needs. It ensures that the Product Design evolves to facilitate innovation and
    optimize business outcomes.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-evaluate
  name: "IT4IT: Evaluate"
  desc: >-
    The value stream "Evaluate" contributes to the business strategy and portfolio
    planning activities. It provides a blueprint for optimizing products,
    services, and investment Portfolio Management. This value stream is focused on
    the continuous assessment and evaluation of the entire Digital Product
    Portfolio to optimize co-creation and alignment of business and technology
    Strategic Objectives.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-integrate
  name: "IT4IT: Integrate"
  desc: >-
    The value stream "Integrate" creates a new Product Release. It covers the
    planning, design, development (or configuration), and testing of a new Product
    Release (in non-production environments), and makes the Product Release
    available for deployment and release into production. A new Product Release
    can also be related to an emergency fix needed to resolve a production issue
    (such as resolving vulnerabilities and critical bugs).
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-deploy
  name: "IT4IT: Deploy"
  desc: >-
    The value stream "Deploy" is installing a Product Release into production. It
    can also imply the removal, disposal, or updating of an existing installed
    Product Release, so it is made available or unavailable to the customer. Many
    possible strategies for deploying a Product Release can be scenarios within
    the Deploy value stream; for example, deployment to a targeted audience, or
    deployment using a dark launch in which functionality is not directly released
    to consumers. If the user requirements and/or the characteristics of the
    Digital Product demand that the installed Product Release is improved,
    released, and deployed frequently, a drive to automate these value streams can
    emerge. To comply with regulatory requirements, organizations can require
    approvals and an audit trail of all the Changes made in production
    environments. The Deploy value stream ensures that all changes are tracked and
    related to a specific Product Release.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-release
  name: "IT4IT: Release"
  desc: >-
    The value stream "Release" ensures that the Service Offers for ordering a new,
    a change in, or the decommissioning of an Actual Product Instance or its
    support to them are offered to consumers. The Release value stream maintains
    the Service Offer Catalog, the catalog views, and the Service Offer promotion
    and information of available Service Offers to the consumer base so that the
    individual consumer can find and order Digital Products, or support for them.
    Service Offers should be made available for viewing and requests for access
    over multiple channels. This value stream publishes the Service Offers based
    on various triggers and inputs, such as:
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-operate
  name: "IT4IT: Operate"
  desc: >-
    The value stream "Operate" monitors and ensures that the availability and
    performance of Actual Product Instances are within the boundaries of their
    agreed Service Contract and Key Performance Indicator (KPI) targets. The scope
    of this value stream includes managing any compliance and security aspects of
    running Digital Product Instances and underlying systems that may result from
    deployment and/or fulfillment. The IT4IT Standard describes how to achieve
    this using integrated, automated, or fully autonomous data flows between the
    event monitoring (Event, Incident, Change, Configuration, and Problem
    Management) functions of the digital services. In addition, the data flows may
    be designed to be reactive, proactive, or predictive, and include a
    retrospective.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-consume
  name: "IT4IT: Consume"
  desc: >-
    The value stream "Consume" manages the lifecycle of consuming a Digital
    Product. Digital Products are consumed as services and the lifecycle is
    managed as a Subscription to the service.
  props: {source: it4it}

- {type: ValueStream, id: it4it-explore-architecture, name: "Explore: Define Digital Product Architecture", props: {source: it4it}}
- type: ValueStream
  id: it4it-explore-refine-backlog
  name: "Explore: Refine Product Backlog"
  desc: >-
    The purpose of the value stream stage "Refine Product Backlog" is to translate
    a Scope Agreement into smaller pieces of work that can be assigned to product
    level features and linked to the product backlog. This includes organizing
    assigned backlog items into work packages and adjusting the Scope Agreement,
    business case, and budget as needed. The deliverables for this value stream
    stage are established Architecture Roadmap Items.
  props: {source: it4it}
- type: ValueStream
  id: it4it-explore-prioritize-backlog
  name: "Explore: Prioritize Backlog Items"
  desc: >-
    The purpose of the value stream stage "Prioritize Backlog Items" is to refine
    qualified Portfolio Backlog Items and mandates for new or existing Digital
    Product investment decisions. The budget allocated in the Evaluate value
    stream for the Product Portfolio is used to explore Digital Product ideas and
    determine feasibility. This should include ensuring that scoped Product
    Backlog Items deliver value, mitigate risks, and meet governance criteria
    (technology, security, reliability, supportability, etc.). The deliverables
    for this value stream stage are a Scope Agreement with prioritized Product
    Backlog Items; scope and timing refined.
  props: {source: it4it}
- type: ValueStream
  id: it4it-explore-roadmap
  name: "Explore: Finalize Roadmap & Scope Agreement"
  desc: >-
    The purpose of the value stream stage "Finalize Roadmap & Scope Agreement" is
    to assign work and begin to conduct planning meetings on a regular cadence.
    Stakeholder buy-in and agreement to the Release roadmap and outcomes must be
    obtained. This includes setting up tracking and reporting on progress. The
    deliverables for this value stream stage are an approved Architecture Roadmap
    and outcomes.
  props: {source: it4it}

- type: ValueStream
  id: it4it-evaluate-influencers
  name: "Evaluate: Gather Influencers"
  desc: >-
    The purpose of the value stream stage "Gather Influencers" is to bring
    together inputs for a planning cycle. Typical inputs include: consumer demand,
    improvement ideas, new technology opportunities, technology lifecycle events
    (e.g., end-of-life), and any known policy (legal and regulatory demands) or
    budget constraints for the Digital Product Portfolio. Other inputs may include
    an internal and/or external environmental scan to identify strengths,
    weaknesses, opportunities, and threats. Discussion with the business is
    centered on Digital Product value delivery for consumers and corresponding
    policy requirements. The deliverable for this value stream stage is new or
    updated Strategic Themes and/or Strategic Objectives.
  props: {source: it4it}
- type: ValueStream
  id: it4it-evaluate-backlog-mandates
  name: "Evaluate: Define Backlog Mandates"
  desc: >-
    The purpose of the value stream stage "Define Backlog Mandates" is to
    determine if there are any mandates or directives that will impact the Product
    Portfolio, and to ensure mandates are clearly defined in backlog items and
    related in Scope Agreements. This should include a review of the existing
    portfolio and managed service provider agreements. Portfolio rationalization
    to balance the portfolio should be completed regularly and may generate
    backlog items that are bundled into Scope Agreements. Upon approval to proceed
    on a Scope Agreement, initial funding is allocated to the Explore value stream
    to identify concerns specific to a Digital Product and determine feasibility.
    The deliverables for this value stream stage are refined Scope Agreements to
    reflect mandates and defined Architecture Roadmap Items.
  props: {source: it4it}
- {type: ValueStream, id: it4it-evaluate-governance, name: "Evaluate: Ensure Governance", props: {source: it4it}}
- {type: ValueStream, id: it4it-evaluate-gaps, name: "Evaluate: Identify Gaps", props: {source: it4it}}
- type: ValueStream
  id: it4it-evaluate-investments
  name: "Evaluate: Propose Investments"
  desc: >-
    The purpose of the value stream stage "Propose Investments" is to prioritize a
    list of opportunities and associated Scope Agreements. The prioritization
    should be based on a scoring method that considers business value, risk,
    costs, time, and resource availability. Scope Agreements are evaluated to
    determine if there is already a solution in the Product Portfolio that can be
    used or modified to satisfy the business need. If it is determined that there
    is not an existing solution and the new demand is in alignment with the
    digital strategy, the Scope Agreement is assessed against other work in the
    Portfolio Backlog and prioritized accordingly. The prioritization criteria
    should also consider factors like urgency and the impact of opportunities. The
    deliverable for this value stream stage is updated Scope Agreements with
    clarifications discovered during a prioritization of opportunities.
  props: {source: it4it}

- type: ValueStream
  id: it4it-integrate-plan-release
  name: "Integrate: Plan Product Release"
  desc: >-
    The purpose of the value stream stage "Plan Product Release" is to plan all
    development and testing activities required for creating the Product Release.
    Multiple teams may be needed, and different development methodologies may be
    used. This value stream stage is revisited as it oversees the other value
    stream stages in this value stream to cater for changes in the planning and
    iterations of the Design & Develop value stream stage.
  props: {source: it4it}
- type: ValueStream
  id: it4it-integrate-design-develop
  name: "Integrate: Design & Develop"
  desc: >-
    The purpose of the value stream stage "Design & Develop" is to analyze the
    requirements, create (or update) the design artifacts, and develop the changes
    (and associated Test Cases) for the Product Release. This includes the coding
    and configuration of software and related infrastructure (e.g., infrastructure
    as code).
  props: {source: it4it}
- {type: ValueStream, id: it4it-integrate-build-test, name: "Integrate: Build, Integrate, & Test", props: {source: it4it}}
- type: ValueStream
  id: it4it-integrate-accept-publish
  name: "Integrate: Accept & Publish Release"
  desc: >-
    The purpose of the value stream stage "Accept and Publish Release" is to
    accept the Product Release as a candidate for deployment into production. The
    required change authority, such as the Product Manager, accepts the Product
    Release for deployment and/or release into production. The Product Manager
    accepts the Product Release after engaging with relevant stakeholders, which
    includes reviewing test results to accept or reject the list of remaining
    Defects, and reviewing the collateral produced. In a DevOps model, Operations
    has been participating all along but at this point an approval is given for
    the Product Release to be deployed into production.
  props: {source: it4it}

- type: ValueStream
  id: it4it-deploy-plan-approve
  name: "Deploy: Plan & Approve Deployment"
  desc: >-
    The purpose of the value stream stage "Plan & Approve Deployment" is to create
    a deployment plan for a Digital Product and, based on this plan, to sign it
    off with all relevant stakeholders.
  props: {source: it4it}
- type: ValueStream
  id: it4it-deploy-fulfill
  name: "Deploy: Fulfill Deployment"
  desc: >-
    The purpose of the value stream stage "Fulfill Deployment" is to execute the
    Fulfillment Orchestration when the change window for deployment is open. The
    Fulfillment Orchestration is documented in the change records and can be coded
    as part of the Product Release to automate the Fulfillment Orchestration.
  props: {source: it4it}
- {type: ValueStream, id: it4it-deploy-observe, name: "Deploy: Observe Deployment", props: {source: it4it}}
- type: ValueStream
  id: it4it-deploy-validate
  name: "Deploy: Validate Deployment"
  desc: >-
    The purpose of the value stream stage "Validate Deployment" is to ensure that
    all aspects of the deployment activities were correctly executed. This
    includes checking that the Product Instance is indeed running and configured
    according to plan, and that the monitoring and documentation associated is
    configured and made available.
  props: {source: it4it}

- type: ValueStream
  id: it4it-release-define-offer
  name: "Release: Define Service Offer"
  desc: >-
    The purpose of the value stream stage "Define Service Offer" is to obtain the
    Service Offer information from the Integrate value stream and to plan the
    creation and publication of Service Offers to Consumers. Offers can also
    represent the consumption of cloud services making the Service catalog an
    Aggregation catalog between their own and cloud services; planning should take
    place to identify which cloud Service Offers would be made available.
  props: {source: it4it}
- type: ValueStream
  id: it4it-release-implement-offer
  name: "Release: Implement Service Offer"
  desc: >-
    The purpose of the value stream stage "Implement Service Offer" is to onboard
    the Service Offer into the Service Offer Catalog and to prepare all that is
    needed so that the Service Offer can be published.
  props: {source: it4it}
- type: ValueStream
  id: it4it-release-publish-offer
  name: "Release: Publish Service Offer"
  desc: >-
    The purpose of the value stream stage "Publish Service Offer" is to activate
    or release the Service Offer so that it can be ordered by consumers.
  props: {source: it4it}

- type: ValueStream
  id: it4it-operate-detect
  name: "Operate: Detect Issue"
  desc: >-
    The purpose of the value stream stage "Detect Issue" is to detect issues in an
    Actual Product Instance or system that has caused or may cause degradation of
    the service or breach the agreed service levels, then to prioritize and assign
    them for further diagnosis in a structured and repeatable manner.
  props: {source: it4it}
- type: ValueStream
  id: it4it-operate-diagnose
  name: "Operate: Diagnose Issue"
  desc: >-
    The purpose of the value stream stage "Diagnose Issue" is to prepare the
    best/quickest course of action to retain or restore normal operations. Further
    diagnosis can be performed to identify the root cause(s) of a potential or
    detected issue.
  props: {source: it4it}
- type: ValueStream
  id: it4it-operate-resolve
  name: "Operate: Resolve Issue"
  desc: >-
    The purpose of the value stream stage "Resolve Issue" is to execute the
    (prepared) course of action to retain, restore, and confirm normal service
    operations.
  props: {source: it4it}

- {type: ValueStream, id: it4it-consume-publish-status, name: "Consume: Publish Service Status", props: {source: it4it}}
- {type: ValueStream, id: it4it-consume-support, name: "Consume: Provide Service Support", props: {source: it4it}}
- type: ValueStream
  id: it4it-consume-agree-offer
  name: "Consume: Agree to Service Offer"
  desc: >-
    The purpose of the value stream stage "Agree to Service Offer" is to get
    agreement from the customer to the terms and conditions of the Service
    Contract.
  props: {source: it4it}
- type: ValueStream
  id: it4it-consume-subscribe-offer
  name: "Consume: Subscribe to Service Offer"
  desc: >-
    The purpose of the value stream stage "Subscribe to Service Offer" is to make
    the Actual Product Instance, as result of the Order and Desired Product
    Instance, available to the customer, in such a way that the customer is able
    to consume the Digital Product.
  props: {source: it4it}
- type: ValueStream
  id: it4it-consume-select-offer
  name: "Consume: Select an Offer"
  desc: >-
    The purpose of the value stream stage "Select an Offer" is to help the
    customer to select the Digital Product Service Offers(s) best suited to their
    needs.
  props: {source: it4it}

# --- Capabilities reachable from a stage via the source model's own
#     DataObject -> Resource -> Capability chain (Realization; Realization;
#     Assignment) — see relationships.yaml section D for the derived
#     Stage<-Capability edges these back. ---
- type: Capability
  id: it4it-cap-architecture-mgmt
  name: "IT4IT: Architecture Management"
  desc: >-
    The ability to manage architecture is required to effectively describe the
    as-is and target architecture or 'blueprints' of the enterprise, to define the
    policies and standards used by it, and govern solution compliance to the
    defined architecture, policies, and standards. At an enterprise level, it
    includes enterprise architecture, the sub-domain specialties of enterprise
    architecture; at a tactical or service level, it includes solution
    architecture, service architecture, and systems (technology) architecture. The
    purpose of the Manage Architecture Capability is to use architecture policies
    and artifacts to provide the organization: - The ability to steer strategic
    decisions toward wanted positions and business outcomes (the future state) -
    The ability to proactively and holistically lead enterprise responses to
    business strategies and external drivers. - The ability to present business
    and IT leaders with recommendations to achieve target business outcomes and
    secure implementation of the transition roadmap.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-asset-mgmt
  name: "IT4IT: Asset Management"
  desc: >-
    The ability to track and report the value and ownership of capital assets
    throughout their life cycle.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-config-mgmt
  name: "IT4IT: Configuration Management"
  desc: >-
    The ability to maintain information about Configuration Items required to
    deliver an IT Service, including their Relationships. This information is
    managed throughout the Lifecycle of the CI.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-defect-mgmt
  name: "IT4IT: Defect Management"
  desc: >-
    The ability to keep track of all Defects by registering Defects of all types
    (including security-related Defects). It analyzes Defects and finds
    resolutions. It also associates Defects with Requirements.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-demand-mgmt
  name: "IT4IT: Demand Management"
  desc: >-
    The ability to understand and influence Customer demand for Services and the
    provision of Capacity to meet these demands. At a Strategic level Demand
    Management can involve analysis of Patterns of Business Activity and User
    Profiles. At a tactical level it can involve use of Differential Charging to
    encourage Customers to use IT Services at less busy times.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-event-mgmt
  name: "IT4IT: Event Management"
  desc: >-
    The capability to manage Events throughout their Lifecycle. Event Management
    is one of the main Activities of IT Operations.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-financial-mgmt
  name: "IT4IT: Financial Management"
  desc: >-
    The ability to manage an IT Service Provider’s financial accounts and to bill
    for and accept payment for services, or to make payment for services purchased
    and rendered. In an external provider archetype, may also include vetting of
    consumer credit applications and tax accounting.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-incident-mgmt
  name: "IT4IT: Incident Management"
  desc: >-
    The ability responsible for managing the Lifecycle of all Incidents. The
    primary Objective of Incident Management is to return the IT Service to
    Customers as quickly as possible.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-measurement-reporting
  name: "IT4IT: Measurement & Reporting"
  desc: >-
    Measurement & Reporting is the ability to consolidate information across the
    various value streams and functional components, to assess and evaluate
    metrics and KPIs, and provide service reporting, analytics, dashboards and
    scorecards.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-operations-mgmt
  name: "IT4IT: Operations Management"
  desc: >-
    The ability to perform activities carried out by IT Operations Control,
    including Console Management, Job Scheduling, Backup and Restore, and Print
    and Output Management. IT Operations is also used as a synonym for Service
    Operation
  props: {source: it4it}
- type: Capability
  id: it4it-cap-policy-mgmt
  name: "IT4IT: Policy Management"
  desc: >-
    The ability to define and maintain the policies, principles, rules and
    standards governing the implementation to be compliant towards the target
    state.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-problem-mgmt
  name: "IT4IT: Problem Management"
  desc: >-
    The ability to manage the Lifecycle of all Problems. The primary objectives of
    Problem Management are to prevent Incidents from happening, and to minimize
    the Impact of Incidents that cannot be prevented.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-procurement-mgmt
  name: "IT4IT: Procurement Management"
  desc: >-
    The ability to receive and execute purchase orders for supplies, equipment,
    products, and services, and to handle purchase exceptions.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-backlog-mgmt
  name: "IT4IT: Product Backlog Management"
  desc: >-
    The ability to plan, resource, and execute a sequenced set of activities of
    prescribed duration that are managed together to achieve a defined scope of
    deliverables and other outcomes within established time, budget, and quality
    parameters.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-design-mgmt
  name: "IT4IT: Product Design Management"
  desc: >-
    The ability to design new or changed service software functionality and data.
    Ability to identify the new or existing services required to meet the needs of
    the Scope Agreement and IT Initiative, including both service systems and
    service offers.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-development
  name: "IT4IT: Product Development"
  desc: >-
    The ability to implement new or changed software services application and data
    components by coding, code unit verification and defect correction.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-portfolio-mgmt
  name: "IT4IT: Product Portfolio Management"
  desc: >-
    The ability to create and manage the portfolio of services in plan,
    transition, production, and retirement with the aim to deliver the maximal
    aggregate value to the business objectives.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-release-mgmt
  name: "IT4IT: Release Management"
  desc: >-
    The ability to plan, schedule and control the movement and installation of
    release configurations to test and live environments, while ensuring that the
    integrity of the environment is protected and that the correct components are
    released.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-request-mgmt
  name: "IT4IT: Request Management"
  desc: >-
    The ability to provide a channel for users to request and receive offered
    services.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-requirements-mgmt
  name: "IT4IT: Requirements Management"
  desc: >-
    The ability to manage requirements through the lifecycle of a service. It
    collects, refines, scopes, and tracks progress of and maintains requirements
    before and after an IT Initiative(s) ha(s)(ve) been delivered. It maintains
    the traceability of each requirement to the original source (demand, IT or
    business standard or policy, and/or requestor) and to the source (code),
    solutions and/or test cases throughout the service lifecycle. Requirements can
    be maintained for different levels. For example: - At an enterprise level,
    external market business and IT requirements are maintained; - At a tactical
    or service automation level, software process and service automation
    requirements are managed; - At an operational level, performance and
    availability requirements are managed.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-service-catalog-mgmt
  name: "IT4IT: Service Catalog Management"
  desc: >-
    The ability to publish and maintain a database or structured Document with
    information about all Live IT Services, including those available for
    deployment. It also includes the set of services available for reuse in the
    development of applications and other services. The former are contracted for
    via SLA, the latter by OLA.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-service-level-mgmt
  name: "IT4IT: Service Level Management"
  desc: >-
    The ability to define and negotiate service warranties and qualities of
    service that comprise standard or custom service level offerings, and to
    govern compliance to them. SLM is responsible for ensuring that all IT Service
    Management Processes, Operational Level Agreements, and Underpinning
    Contracts, are appropriate for the agreed Service Level Targets. SLM monitors
    and reports on Service Levels, and holds regular Customer reviews.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-test-mgmt
  name: "IT4IT: Test Management"
  desc: >-
    The ability to plan and execute tests that ensure the IT service will support
    the customer’s requirements at the agreed service levels. It prepares test
    environment, plans and designs tests, and executes all functional and
    non-functional tests including performance and stress testing.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-vendor-mgmt
  name: "IT4IT: Vendor Management"
  desc: >-
    The ability to ensure that all Contracts and agreements with Internal and
    External Service Providers/Suppliers support the needs of the Business, and
    that all Internal and External Service Providers/Suppliers meet their
    contractual/agreed commitments.
  props: {source: it4it}

# --- Remaining IT4IT 3.0 capabilities not reached via the derivation chain
#     above (id-prefixed the same way; not yet linked to any stage or bridge
#     relationship). 7 of these have no documentation in the source. Excludes
#     the source model's one placeholder element literally named "Capability"
#     (no documentation, no relationships — a modelling artefact, not a real
#     domain concept). ---
- type: Capability
  id: it4it-cap-availability-mgmt
  name: "IT4IT: Availability Management"
  desc: >-
    The ability to define, analyze, Plan, measure and improve all aspects of the
    Availability of IT Services. Availability Management is responsible for
    ensuring that all IT Infrastructure, Processes, Tools, Roles, etc. are
    appropriate for the agreed Service Level Targets for Availability.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-capacity-mgmt
  name: "IT4IT: Capacity Management"
  desc: >-
    The ability to ensure that the Capacity of IT Services and the IT
    Infrastructure is able to deliver agreed Service Level Targets in a Cost
    Effective and timely manner. Capacity Management considers all Resources
    required to deliver the IT Service, and plans for short-, medium- and
    long-term Business Requirements. The Resources used by each IT Service and the
    pattern of usage over time are collected, recorded, and analyzed for use in
    the Capacity Plan.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-change-mgmt
  name: "IT4IT: Change Management"
  desc: >-
    The ability to control the lifecycle of all changes from request to
    resolution. The primary objective of Change Management is to enable beneficial
    Changes to be made with minimum disruption to Services.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-collaboration
  name: "IT4IT: Collaboration"
  desc: >-
    The Collaboration & Communication function supports many other IT4IT
    Functional Components by enabling optimal collaboration and communication
    between the various stakeholders and parties within the ecosystem, including
    internal and external collaboration with all parties in the digital
    ecosystem. Source: IT4IT 3.0.1 standard, section 10.6 (undocumented in the
    ArchiMate exchange file; pulled from the published standard PDF instead).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-compliance-mgmt
  name: "IT4IT: Compliance Management"
  desc: >-
    Part of the combined IT4IT Governance, Risk, & Compliance function: ensures
    that security, risk, and compliance are fully embedded into the digital
    delivery network, including all involved parties and vendors, with
    transparency and traceability of compliance information — including
    continuous monitoring of compliance, audit management (performing audits to
    identify issues and exceptions), and managing deviations/exceptions. Source:
    IT4IT 3.0.1 standard, section 10.2 (the standard does not define Compliance
    Management separately from Risk Management — see it4it-cap-risk-mgmt;
    undocumented in the ArchiMate exchange file).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-continuity-mgmt
  name: "IT4IT: Continuity Management"
  desc: >-
    The ability to manage improvements to IT Service Management Processes and IT
    Services. The Performance of the IT Service Provider is continually measured
    and improvements are made to Processes, IT Services and IT Infrastructure in
    order to increase Efficiency, Effectiveness, and Cost Effectiveness.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-contract-mgmt
  name: "IT4IT: Contract Management"
  desc: >-
    Manages the Contract — the relationship between provider and consumer
    created when an Offer is accepted and a Digital Product Instance is created
    — including all details required for financial recording, governance,
    measurement, charging, support, and servicing of that instance. Source:
    IT4IT 3.0.1 standard, sections 2.1 and 4.2.3. Caveat: the standard does not
    define a distinct "Contract Management" function or capability — this is
    adapted from its definitions of the Contract concept and the Contract
    Definition data object; contract management systems are explicitly called
    out as non-normative Supporting Capabilities supplied externally.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-customer-relationship-mgmt
  name: "IT4IT: Customer Relationship Management"
  desc: >-
    The ability to maintain relationships with service consumers. In an Internal
    IT Provider archetype, Business Relationship Management or BRM is the the
    capability to maintain a Relationship with the internal enterprise Line of
    Business Unit consumers and stakeholders. Business Relationship Management
    usually includes: - Managing personal Relationships with Business managers;
    Providing input to Service Portfolio Management - Ensuring that the IT Service
    Provider is satisfying the Business needs of the Customers. - In an External
    Service Provider context, Customer Relationship or CRM, which means it is the
    ability to do the BRM, except it is not with internal but with external
    customers and organizations.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-customer-support
  name: "IT4IT: Customer/User Support"
  desc: >-
    The ability to assist users with interactions to service support. The support
    capability is be provided via varity of media (e.g. click, call, face),
    assists VIP's, allows for self-help, has the ability to list current
    disruptions and routes interactions to the correct supporting agents.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-deployment-mgmt
  name: "IT4IT: Deployment Management"
  desc: >-
    Inferred, not sourced: the standard names no "Deployment Management"
    function or functional component anywhere — confirmed absent from both the
    ArchiMate exchange file and the full published IT4IT 3.0.1 standard PDF,
    and no definition could be found via web search either. This description
    is inferred from the Deploy value stream's stages (Plan & Approve, Fulfill,
    Observe, Validate): the ability to plan, execute, and validate the release
    of a Release Package into a target environment, and to observe and roll
    back that deployment if it fails validation. Treat this as a best-effort
    placeholder, not an authoritative IT4IT definition.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-identity-access-mgmt
  name: "IT4IT: Identity and Access Management"
  desc: >-
    The ability to design, develop manage, and control the security of automation
    services and information to meet requirements. The capability to ensure the
    Confidentiality, Integrity and Availability of an Organization’s Assets,
    information, data and IT Services. Authorization and Access Management usually
    forms part of an organizational approach to Security Management that has a
    wider scope than the IT Service Provider, and includes handling of paper,
    building access, phone calls, etc., for the entire organization.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-knowledge-mgmt
  name: "IT4IT: Knowledge Management"
  desc: >-
    The ability to gather, analyze, store and share knowledge and information
    within an Organization. The primary purpose of Knowledge Management is to
    improve Efficiency by reducing the need to rediscover knowledge.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-performance-mgmt
  name: "IT4IT: Performance Management"
  desc: >-
    The ability responsible for day-to-day Performance Management Activities.
    These include monitoring, threshold detection, Performance analysis and
    Tuning, and implementing changes related to Performance and Capacity.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-portfolio-backlog-mgmt
  name: "IT4IT: Portfolio Backlog Management"
  desc: >-
    The ability to provide lifecycle management and visibility of Portfolio
    Backlog Items as grouped into collections of work and prioritized;
    supports the Evaluate, Explore, and Integrate value streams. Source: IT4IT
    3.0.1 standard, section 6.2.1 "Portfolio Backlog Functional Component"
    (undocumented in the ArchiMate exchange file; pulled from the published
    standard PDF instead).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-sales-mgmt
  name: "IT4IT: Product Sales Management"
  desc: >-
    The ability to generate, accept, approve, and manage customer orders for
    products and services.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-risk-mgmt
  name: "IT4IT: Risk Management"
  desc: >-
    Part of the combined IT4IT Governance, Risk, & Compliance function: the
    ability to identify, classify, manage, and mitigate risk in an increasingly
    complex digital environment, including maintaining a risk register,
    performing risk assessments (including vendor risk), and defining and
    implementing mitigation plans. Source: IT4IT 3.0.1 standard, section 10.2
    (the standard does not define Risk Management separately from Compliance
    Management — see it4it-cap-compliance-mgmt; undocumented in the ArchiMate
    exchange file).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-strategy-mgmt
  name: "IT4IT: Strategy Management"
  desc: >-
    The ability to create establish business strategies and business plans to
    increase customer value, to lead the direction for the organization into the
    future, to develop and harmonize the organizations strategic landscape and to
    develop competitive business strategies.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-workforce-mgmt
  name: "IT4IT: Workforce Management"
  desc: >-
    Supports the HR Management aspects within the digital delivery model,
    ensuring the resource portfolio, skills, and competencies are aligned with
    the strategic direction — including onboarding/off-boarding, team
    administration, resource allocation, and employee career development.
    Source: IT4IT 3.0.1 standard, section 10.3 (undocumented in the ArchiMate
    exchange file; pulled from the published standard PDF instead).
  props: {source: it4it}

# --- The 4 canonical IT4IT value-stream domains, grouping the capabilities
#     above by home stream (source model's own Aggregation edges — the only
#     genuine cap-to-cap structure it carries; see relationships.yaml section D
#     for the edges and why the finer overlapping sub-groupings, e.g. "Assure"/
#     "Develop"/"Test", were left out). Grouping carries no layer semantics and
#     is exempt from viewpoint filtering, so it's safe on the Capability Map
#     view alongside the strict capability/outcome/resource allow-list. ---
- type: Grouping
  id: it4it-domain-strategy-to-portfolio
  name: "IT4IT: Strategy to Portfolio"
  desc: >-
    The value-stream domain covering the capabilities that shape enterprise and
    solution strategy into a governed portfolio of demand.
  props: {source: it4it}
- type: Grouping
  id: it4it-domain-requirement-to-deploy
  name: "IT4IT: Requirement to Deploy"
  desc: >-
    The value-stream domain covering the capabilities that take a requirement
    through design, development, and release readiness.
  props: {source: it4it}
- type: Grouping
  id: it4it-domain-request-to-fulfill
  name: "IT4IT: Request to Fulfill"
  desc: >-
    The value-stream domain covering the capabilities that take a customer
    request through to a fulfilled, billed service.
  props: {source: it4it}
- type: Grouping
  id: it4it-domain-detect-to-correct
  name: "IT4IT: Detect to Correct"
  desc: >-
    The value-stream domain covering the capabilities that detect, diagnose,
    and resolve operational issues to assure service delivery.
  props: {source: it4it}

