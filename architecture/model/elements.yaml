# Frictionless Architecture & Governance Platform — model elements
#
# Canonical source of truth. `build.py` projects this + relationships.yaml into
# frictionless-architect.xml (Open Group Exchange Format); every diagram is a
# projection of that. Do not hand-edit the generated XML.
#
# Schema:  type / id / name / desc? / props?
#   type   bare ArchiMate 3.2 concept name (pyArchimate.ArchiType), case-insensitive
#   id     stable kebab id -> deterministic UUID (never renumber a live id)
#   props  str->str; c4 hints, requirement-type, artefact metadata
#
# Sections:
#   A. Motivation + Strategy + Business — the load-bearing skeleton
#   B. Application — the six-subsystem ecosystem (C4 context / container views)
#   C. Application — the artefact input/output pipeline (functions + artefacts)
#
# Authoring note — Assessment wording (not mechanically checked, review by eye):
#   An Assessment's `name` must be written in the vocabulary of the Stakeholder
#   who holds its Driver, not in architecture/implementation jargon. A board
#   stakeholder reasons about market position and revenue risk, not "manual
#   architecture governance" — push the technical cause into `desc` instead of
#   the headline. (`build.py`'s `check_motivation_conventions` catches
#   structural mistakes — a Driver bypassing its Assessment, a derived
#   Constraint/Requirement->Goal edge — but altitude-of-language like this is a
#   judgement call, not a graph check.)

# =====================================================================
# A. MOTIVATION — Drivers (why the platform exists)
# =====================================================================
- type: Driver
  id: driver-agility
  name: Market Agility & Competitive Pressure
  desc: >-
    In an AI-driven landscape the "cost of delay" is existential. If the bank
    cannot deliver features as fast as a startup or a tech giant, it loses
    market share.
- type: Driver
  id: driver-compliance
  name: Regulatory Resiliency & Social License
  desc: >-
    For a major financial institution, non-compliance with APRA CPS 230/234 is a
    threat to the banking license. Manual compliance is too slow and error-prone
    for an AI-speed world.
- type: Driver
  id: driver-sustainability
  name: Systemic Sustainability & Complexity Management
  desc: >-
    Unmanaged architectural drift creates hidden debt that makes systems
    fragile. Left unchecked, the system eventually becomes too complex to change
    at any speed.
- type: Driver
  id: driver-scaling
  name: Human-to-Machine Operational Scaling
  desc: >-
    Human architects are a finite bottleneck. As AI agents produce changes at
    machine speed, it is physically impossible to review it all with traditional
    methods.

# =====================================================================
# A. MOTIVATION — Stakeholders (who holds the drivers) and Assessments
#    (the analysis of the current situation that makes each driver urgent).
#    Stakeholder viewpoint: stakeholders -> drivers -> goal/outcome.
# =====================================================================
- type: Stakeholder
  id: stk-exec
  name: Executive Leadership & Board
  desc: >-
    Accountable for the banking licence, market position and the enterprise
    risk appetite. Holds the agility and compliance drivers.
- type: Stakeholder
  id: stk-regulator
  name: Prudential Regulator (APRA)
  desc: >-
    External stakeholder. Requires demonstrable, continuous compliance with
    CPS 230/234 and sound model risk management.
- type: Stakeholder
  id: stk-architecture
  name: Enterprise Architecture Function
  desc: >-
    Owns architectural coherence and the target state; carries the
    sustainability and complexity-management concern.
- type: Stakeholder
  id: stk-delivery
  name: Delivery Organisation
  desc: >-
    Human engineers and AI delivery agents producing change at machine speed;
    holds the operational-scaling concern.
- type: Stakeholder
  id: stk-risk-compliance
  name: Risk & Compliance Function
  desc: >-
    Second-line assurance. Needs provable, auditable control effectiveness
    rather than after-the-fact manual evidence.

- type: Assessment
  id: assess-time-to-market
  name: Time-to-market is falling behind AI-native competitors, risking market share
  desc: >-
    AI-native challengers ship customer-facing features in days; our
    human-gated change process takes weeks. Every release cycle the gap
    persists is a release cycle of lost competitive ground and revenue at
    risk — a board-level concern, independent of the architectural cause.
- type: Assessment
  id: assess-review-bottleneck
  name: Human review cannot keep pace with AI-speed delivery
  desc: >-
    Change volume from AI agents already exceeds what human architects and
    reviewers can inspect; the gap widens monthly.
- type: Assessment
  id: assess-drift-debt
  name: Architectural drift is accumulating as unmanaged risk
  desc: >-
    As-built systems diverge from intent with no systematic detection; hidden
    architectural debt is compounding.
- type: Assessment
  id: assess-manual-compliance
  name: Manual compliance evidence is too slow and error-prone
  desc: >-
    Control mapping and evidence collection are manual, lag delivery by weeks,
    and cannot be trusted at AI-delivery cadence.

# =====================================================================
# A. MOTIVATION — Goal & Outcome (the aim, and the end result that realizes it)
#    Drivers influence the goal; the Governed Architecture Delivery value
#    stream realizes the outcome; the outcome realizes the goal.
# =====================================================================
- type: Goal
  id: goal-frictionless-architecture
  name: Frictionless Architecture & Governance at Machine Speed
  desc: >-
    Sustain architecturally-sound, provably-compliant change at the speed and
    volume of AI-driven delivery — without a human review bottleneck and
    without accumulating unmanaged architectural drift.
- type: Outcome
  id: outcome-executable-intelligence
  name: Architecture as Executable Intelligence
  desc: >-
    Architecture has moved from passive documentation to executable system
    intelligence: the specification, the controls, and the guardrails are
    machine-readable artefacts that AI agents and pipelines consume directly.

# =====================================================================
# A. MOTIVATION — Principles (constitution-level; cross-binding)
# =====================================================================
- type: Principle
  id: principle-human-accountability
  name: Deterministic Human Accountability
  desc: AI is advisory; the specification is deterministic; a human holds sign-off.
- type: Principle
  id: principle-forensic-audit
  name: Forensic Auditability
  desc: >-
    Ability to reconstruct not just what happened but why a decision was made.
- type: Principle
  id: principle-policy-as-code
  name: Policy as Code
  desc: >-
    All governance rules, compliance mappings, and architectural guardrails are
    expressed as version-controlled, machine-executable policy, not prose
    documents.

# =====================================================================
# A. MOTIVATION — Constraints (regulatory envelope every component inherits)
# =====================================================================
- type: Constraint
  id: const-apra
  name: No Retrospective Compliance (APRA CPS 230/234)
  desc: >-
    The platform must never let a change reach production on a promise to
    check compliance later — every change requires a resolved, evidenced
    obligation mapping before the deployment gate, and continuous
    as-built/as-designed evidence afterward. Retrospective flagging does not
    satisfy APRA's continuous-assurance expectation.
- type: Constraint
  id: const-model-risk
  name: No Autonomous Self-Validation of Agentic Decisions
  desc: >-
    The platform must not allow an AI agent to validate or approve its own
    agentic decision-making. Wherever SR 11-7 / APRA model-risk obligations
    apply, validation must be independent of the agent that produced the
    change, and every validation outcome must be documented as evidence, not
    inferred after the fact.
- type: Constraint
  id: const-privacy
  name: Privacy Mapping Is Mandatory, Not an Out-of-Band Check
  desc: >-
    Any change touching personal information must be automatically mapped to
    its Australian Privacy Act (APP) obligations before the deployment gate,
    and the control catalog must carry APP requirements as machine-readable
    entries the mapping checks against — privacy may never be handled as a
    manual, out-of-band review step.
- type: Constraint
  id: const-cloud-policy
  name: Governed State Confined to Approved Sovereignty Boundary
  desc: >-
    The knowledge graph, audit ledger and control catalog must be hosted,
    processed and reconciled only within approved, in-jurisdiction cloud
    environments. No platform component may source, replicate or reconcile
    governed system state through infrastructure outside that boundary.

# =====================================================================
# A. MOTIVATION — Functional Requirements (each one is a component contract)
# =====================================================================
- type: Requirement
  id: req-auto-spec-generation
  name: Automated Specification Generation from Graph
  desc: >-
    For every approved change request, the system must automatically derive a
    complete, executable architectural specification from the knowledge graph —
    with zero manual authoring by an architect.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-regulatory-mapping
  name: Automated Regulatory Obligation Mapping
  desc: >-
    Every technical change must be automatically mapped to its applicable APRA
    CPS 230/234 obligations before a deployment gate is passed. No change may
    proceed without a resolved compliance mapping.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-pre-deploy-gate
  name: Pre-Deployment Compliance Gate Enforcement
  desc: >-
    The supervisory control plane must intercept and evaluate all
    agent-generated changes against the executable specification before they
    reach any test or production environment. Non-compliant changes must be
    blocked, not flagged retrospectively.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-continuous-reconciliation
  name: Continuous As-Built vs. As-Designed Reconciliation
  desc: >-
    The system must continuously reconcile observed system state (telemetry,
    deployed artefacts) against the knowledge graph's as-designed intent and
    surface any deviation as a classified drift event.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-human-signoff
  name: Mandatory Human Sign-off for Non-Standard Changes
  desc: >-
    Any change that cannot be deterministically validated against the executable
    specification must be escalated to a named human architect for explicit
    approval. The system must prevent autonomous resolution of ambiguous
    compliance cases.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-control-catalog
  name: Maintained Machine-Readable Control Catalog
  desc: >-
    The platform must maintain the full set of applicable regulatory obligations,
    policies and standards as version-controlled, machine-readable control
    definitions (OSCAL Catalogs and Profiles), kept synchronised with upstream
    regulatory content sources.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-reusable-architecture
  name: Curated Reusable Architecture Library
  desc: >-
    The platform must maintain a curated library of technology-agnostic
    architecture patterns, implementation blueprints and composed solution
    designs — each mapped to its applicable controls and threat model — as the
    reuse basis for all new solution architecture and specification generation.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-authoritative-twin
  name: Authoritative Digital Twin of System State
  desc: >-
    The platform must maintain a live, queryable graph of enterprise technology
    state — an intent plane and an as-built digital twin plane — as the single
    authoritative source of architectural truth that every other capability
    reads from.
  props:
    requirement-type: Functional
- type: Requirement
  id: req-immutable-audit-ledger
  name: Immutable Forensic Audit Ledger
  desc: >-
    Every agent action, gate decision, specification evaluation and governed
    state transition must be recorded to an append-only, queryable ledger
    usable as contemporaneous evidence for regulatory examination.
  props:
    requirement-type: Functional

# =====================================================================
# A. STRATEGY — Primary Capabilities
#    Named as abilities, not the artefact they own. Each is realized by one
#    subsystem (section B) and realizes at least one functional requirement.
# =====================================================================
- type: Capability
  id: cap-digital-twin
  name: Architecture Knowledge Management
  desc: >-
    Maintain a live, queryable graph of the enterprise technology landscape —
    its components, policies, relationships, and regulatory mappings, across an
    intent plane and an as-built twin plane — as the authoritative source of
    architectural truth.
- type: Capability
  id: cap-spec-engine
  name: Executable Specification Generation
  desc: >-
    Deterministically produce machine-consumable architectural specifications
    from the knowledge graph, which AI agents and CI/CD pipelines consume as
    guardrails rather than human-readable documents.
- type: Capability
  id: cap-control-plane
  name: Agentic Development Supervision
  desc: >-
    Constrain, monitor, and intervene in the behaviour of autonomous development
    agents in real time, enforcing architectural and regulatory boundaries
    before code reaches any environment.
- type: Capability
  id: cap-forensic-ledger
  name: Forensic Audit Recording
  desc: >-
    Record every agent action, gate decision, and specification evaluation into
    an immutable, queryable ledger that serves as contemporaneous evidence for
    regulatory examination.
- type: Capability
  id: cap-drift-dashboard
  name: Architectural Drift Detection & Reconciliation
  desc: >-
    Continuously compare observed system telemetry against the as-designed
    knowledge graph and surface deviations — strategic, structural, or agentic —
    in real time.
- type: Capability
  id: cap-human-approval-workflow
  name: Human Oversight & Approval
  desc: >-
    Identify, route, and manage human architect approval for changes that
    deviate from deterministic specifications or present ambiguous compliance
    scenarios, through a defined, auditable sign-off process that upholds
    deterministic human accountability.
- type: Capability
  id: cap-control-catalog
  name: Control & Obligation Management
  desc: >-
    Maintain the authoritative, version-controlled library of control and
    compliance content — external regulatory obligations and the
    organisation's own policies, standards and controls alike — as OSCAL
    Catalogs and Profiles kept synchronised with upstream regulatory sources,
    and map every governed change to its applicable obligations.
- type: Capability
  id: cap-reusable-architecture
  name: Reusable Architecture Curation
  desc: >-
    Curate technology-agnostic architecture patterns, implementation blueprints
    and composed solution designs — with control mappings and threat models — as
    the reusable basis for new solution architecture and specification
    generation, and model candidate and future-state architecture options for
    governance decisions.

# =====================================================================
# A. STRATEGY — Courses of action (the strategic initiatives the capabilities
#    are being built to realize) and Resources (the assets behind them).
#    Strategy viewpoint: resources -> capabilities -> courses of action.
# =====================================================================
- type: CourseOfAction
  id: coa-executable-governance
  name: Shift Governance Into the Pipeline
  desc: >-
    Replace document-and-meeting governance with machine-readable
    specifications, controls and enforcement gates that run inline with
    delivery.
- type: CourseOfAction
  id: coa-living-twin
  name: Operate a Living Architecture Twin
  desc: >-
    Maintain an authoritative, continuously-reconciled model of intended and
    actual architecture as the single source both humans and agents work from.
- type: CourseOfAction
  id: coa-reuse-first
  name: Curate Reuse Before Build
  desc: >-
    Make curated patterns, blueprints and control mappings the default
    starting point for every change, rather than bespoke design.

- type: Resource
  id: res-akg
  name: Architecture Knowledge Graph
  desc: Intangible resource — the graph of intent, controls, patterns and as-built state.
- type: Resource
  id: res-ai-agents
  name: AI Delivery Agents
  desc: Human-equivalent resource — the agentic crew that produces change at machine speed.
- type: Resource
  id: res-control-content
  name: OSCAL Control Content
  desc: Intangible resource — the machine-readable regulatory and control corpus.
- type: Resource
  id: res-ea-practice
  name: Enterprise Architecture Practice
  desc: Human resource — the architects who curate patterns and hold governance decisions.

# =====================================================================
# A. STRATEGY — Value stream (outcome-oriented view of governed delivery;
#    each stage is served by the capabilities that enable it)
# =====================================================================
- type: ValueStream
  id: vs-governed-delivery
  name: Governed Architecture Delivery
  desc: >-
    End-to-end value stream that turns an approved change into a compliant,
    twin-reconciled production release: baseline, specify, build, prove,
    release, reconcile.
- type: ValueStream
  id: vss-baseline
  name: Establish Control & Reuse Baseline
  desc: >-
    Curated controls, obligations, patterns and blueprints are in place to
    build the change against.
- type: ValueStream
  id: vss-specify
  name: Specify the Change
  desc: >-
    A deterministic, executable specification is derived from the knowledge
    graph for the approved change.
- type: ValueStream
  id: vss-build
  name: Build Under Supervision
  desc: >-
    Development agents produce code, tests and manifests within enforced
    architectural and regulatory boundaries.
- type: ValueStream
  id: vss-prove
  name: Prove Compliance
  desc: >-
    The release candidate is evaluated against the specification and the
    expected controls; non-compliant changes are blocked, not flagged later.
- type: ValueStream
  id: vss-release
  name: Release & Attest
  desc: >-
    A compliant release is deployed, human sign-off is captured where required,
    and every decision is recorded to the forensic ledger.
- type: ValueStream
  id: vss-reconcile
  name: Reconcile & Remediate
  desc: >-
    Observed state is continuously reconciled against intent and classified
    drift is routed to remediation.

# =====================================================================
# A. BUSINESS — Processes (the orchestration choreography between components)
# =====================================================================
- type: BusinessProcess
  id: process-spec-generation
  name: Deterministic Spec Generation
  desc: >-
    Scripted, template-driven generation of executable architectural
    specifications from the knowledge graph. AI recommends scope; human holds
    sign-off. Output is the deterministic intent consumed by the agentic crew.
- type: BusinessProcess
  id: process-agentic-crew
  name: Agentic Development Execution
  desc: >-
    Supervised execution of AI-driven development within supervisory control
    plane constraints. Consumes the executable specification, regulation,
    policy, patterns, and controls from the knowledge graph to generate code,
    test suites, and deployment manifests.
- type: BusinessProcess
  id: process-cicd-pipeline
  name: Automated CICD Gate Execution
  desc: >-
    The CI/CD pipeline with the agentic control plane woven in. Evaluates every
    artefact against the executable specification and policy-as-code gates
    before a release is permitted. Blocks on violation; escalates exceptions for
    human review; logs all gate outcomes to the immutable ledger.
- type: BusinessProcess
  id: process-release
  name: Production Release
  desc: >-
    Compliant, traceable-to-spec deployment to production, triggered only after
    all gates have cleared. Automatically auditable end-to-end.
- type: BusinessProcess
  id: process-state-discovery
  name: Current State Discovery
  desc: >-
    Continuous, automated reconciliation of actual system state against
    architectural intent. Surfaces classified drift events for human review;
    does not write directly to the backlog.
- type: BusinessProcess
  id: process-drift-review
  name: Drift Review & Triage Gate
  desc: >-
    Human-gated review of drift findings before they are committed as backlog
    work items. A Solution Architect approves architectural drift; Security &
    Compliance approves regulatory drift. Ensures only validated, prioritised
    findings enter the delivery pipeline.
- type: BusinessFunction
  id: bfn-agentic-delivery
  name: Agentic Delivery Execution
  desc: >-
    GH #25: the stable business capability of turning a deterministic
    architectural specification into supervised, agentic development output,
    independent of the specific spec-generation/build process steps.
- type: BusinessFunction
  id: bfn-release-management
  name: Release Management
  desc: >-
    GH #25: the stable business capability of deploying a gated, compliant
    change to production once all controls have cleared. Distinct from
    bfn-release-enforcement, which gates the release rather than performing it.
- type: BusinessFunction
  id: bfn-drift-management
  name: Drift Management
  desc: >-
    GH #25: the stable business capability of continuously detecting drift
    against architectural intent and gating it through human review before it
    is committed as prioritised backlog work.
- type: BusinessFunction
  id: bfn-policy-conversion
  name: Policy-to-OSCAL Conversion
  desc: >-
    GH #7: the stable business capability of turning authored policy and
    upstream regulatory standards into machine-readable OSCAL Catalogs and
    Profiles, independent of the specific authoring/conversion process steps.
- type: BusinessFunction
  id: bfn-pattern-blueprint-traceability
  name: Pattern & Blueprint Traceability
  desc: >-
    GH #7: the stable business capability of mapping OSCAL Profile controls
    onto reusable architecture patterns and deriving technology-specific
    implementation blueprints with tracked control enablement.
- type: BusinessFunction
  id: bfn-release-enforcement
  name: Release Controls Enforcement
  desc: >-
    GH #7: the stable business capability of gating a release against its
    expected controls before it is permitted to ship.
- type: BusinessFunction
  id: bfn-effectiveness-assurance
  name: Controls Effectiveness Assurance
  desc: >-
    GH #7: the stable business capability of continuously verifying that
    deployed controls remain effective in BAU.
- type: BusinessProcess
  id: process-policy-authoring
  name: Policy & Standards Authoring
  desc: >-
    The Compliance Officer / Auditor authors custom policy and standard
    content, informed by upstream regulatory standards. Realized at
    application layer by fn-policy-authoring (authored as Trestle Markdown).
- type: BusinessProcess
  id: process-oscal-conversion
  name: OSCAL Catalog & Profile Generation
  desc: >-
    Converts authored policy content and upstream regulatory standards into
    OSCAL Catalogs and Profiles. Realized at application layer by
    fn-oscal-conversion via a Trestle round-trip.
- type: BusinessProcess
  id: process-pattern-traceability
  name: Pattern Control Traceability Mapping
  desc: >-
    The Enterprise Architect maps generated OSCAL Profile controls onto
    architecture patterns to capture controls traceability. Realized at
    application layer by fn-pattern-authoring.
- type: BusinessProcess
  id: process-blueprint-traceability
  name: Blueprint Control Enablement Mapping
  desc: >-
    The Solution Architect derives technology-specific implementation
    blueprints from a technology-agnostic architecture pattern, capturing
    control enablement status and gaps against the OSCAL Profile. Realized at
    application layer by fn-blueprint-authoring.
- type: BusinessProcess
  id: process-effectiveness-monitoring
  name: Controls Effectiveness Monitoring
  desc: >-
    Platform Operations watches whether deployed controls remain effective in
    BAU, against the same SSP the release gate checked. Realized at
    application layer by fn-effectiveness-monitor.

# =====================================================================
# A. BUSINESS — Objects (business-layer counterparts of the artefacts in
#    section C; Realization links tie each back to its DataObject)
# =====================================================================
- type: BusinessObject
  id: bo-regulatory-standard
  name: Regulatory Standard
  desc: >-
    Upstream regulatory content consumed by the platform (e.g. NIST OSCAL
    catalogs, FedRAMP baselines).
- type: BusinessObject
  id: bo-policy-doc
  name: Policy / Standard Document
  desc: Custom policy or standard authored by the Compliance Officer / Auditor.
- type: BusinessObject
  id: bo-oscal-catalog
  name: OSCAL Catalog
  desc: Machine-readable control catalog.
- type: BusinessObject
  id: bo-oscal-profile
  name: OSCAL Profile
  desc: Tailored control selection / baseline.
- type: BusinessObject
  id: bo-architecture-pattern
  name: Architecture Pattern
  desc: Technology-agnostic, reusable design with mapped controls.
- type: BusinessObject
  id: bo-implementation-blueprint
  name: Implementation Blueprint
  desc: >-
    Technology-specific realisation of an architecture pattern, capturing
    control enablement status and gaps.
- type: BusinessObject
  id: bo-oscal-component
  name: OSCAL Component Definition
  desc: Control implementation claims for a reusable blueprint.
- type: BusinessObject
  id: bo-solution-component
  name: Solution Component
  desc: >-
    A deployed instance of an Implementation Blueprint, specialized for one
    technology and bound into a specific Solution Design.
- type: BusinessObject
  id: bo-solution-design
  name: Solution Design
  desc: >-
    Solution-specific composition of Solution Components, unique to one
    system, closely related to its discovered configuration items.
- type: BusinessObject
  id: bo-oscal-ssp
  name: OSCAL System Security Plan
  desc: >-
    Control implementation for the specific Solution Design it is derived
    from — reconciled against discovered configuration items via the
    existing state-discovery mechanism, not a separate one.
- type: BusinessObject
  id: bo-oscal-assessment-plan
  name: OSCAL Assessment Plan
  desc: >-
    Scope and method for assessing the SSP's declared control implementations
    ahead of a release — deterministically derived from the SSP/profile
    scope, not a hand-authored planning document. Imported by the resulting
    OSCAL Assessment Results (OSCAL requires every Assessment Results
    instance to reference the plan it assessed against).
- type: BusinessObject
  id: bo-oscal-assessment-results
  name: OSCAL Assessment Results
  desc: >-
    Findings on whether the SSP's declared control implementations are
    satisfied. Verified at two cadences — a pre-release gate check and
    continuous BAU monitoring — each a specialised instance of this.
- type: BusinessObject
  id: bo-release-gate-decision
  name: Release Gate Decision
  desc: Pass / block outcome with the controls evaluated at release time.
- type: BusinessObject
  id: bo-control-effectiveness-evidence
  name: Control Effectiveness Evidence
  desc: BAU evidence that a deployed control is (or is not) working.

# =====================================================================
# B. APPLICATION — the platform and its six subsystems
#    (c4=system on the Grouping -> C4 System_Boundary; the ApplicationComponents
#     it composes -> C4 Containers; each subsystem's fine-grained functions are
#     the section-C ApplicationFunctions Assignment-linked to it)
# =====================================================================
- type: Grouping
  id: sys-platform
  name: Frictionless Architecture Platform
  desc: Governs architecture from authored policy through to BAU control effectiveness.
  props:
    c4: system
- type: ApplicationComponent
  id: sub-catalog
  name: Controls & Compliance Catalog
  desc: >-
    Authors custom policies and standards and converts them to OSCAL Catalogs
    and Profiles.
- type: ApplicationComponent
  id: sub-library
  name: Reusable Architecture Library
  desc: >-
    Composable patterns, blueprints and solution designs with OSCAL references,
    threat modelling, and modelling of candidate / future-state options for
    governance to decide on.
- type: ApplicationComponent
  id: sub-twin
  name: Digital Twin & Knowledge Graph
  desc: >-
    Maintains the Architecture Knowledge Graph: an intent plane and a
    current-state digital twin plane.
- type: ApplicationComponent
  id: sub-governance
  name: Architecture Governance
  desc: >-
    Comparative evaluation of candidate options, impact assessment, the decision
    and its ADR, and archival of the rejected options with reasons. Pure
    decision-making — the options themselves are modelled in the Reusable
    Architecture Library.
- type: ApplicationComponent
  id: sub-assurance
  name: Conformance & Drift Assurance
  desc: >-
    Enforces controls at release, monitors effectiveness in BAU, and detects and
    reports architecture drift.
- type: ApplicationComponent
  id: sub-modelling
  name: Modelling & Specification
  desc: >-
    Out-of-the-box ArchiMate / C4 / UML modelling, and generation of development
    specifications.

# --- B. Shared stores (DataObject composed by the platform -> C4 ContainerDb) ---
- type: DataObject
  id: store-oscal
  name: OSCAL Repository
  desc: OSCAL Catalogs, Profiles, Components, SSPs and Assessment Results.
- type: DataObject
  id: store-patterns
  name: Pattern & Blueprint Repository
  desc: Architecture patterns, implementation blueprints and solution designs.
- type: DataObject
  id: store-akg
  name: Architecture Knowledge Graph
  desc: "One graph store, two planes: Architecture Intent and Current-State Digital Twin."
- type: DataObject
  id: store-frameworks
  name: Framework Pack Library
  desc: NIST / FedRAMP baselines; ArchiMate / C4 / UML metamodels.
- type: DataObject
  id: store-ledger
  name: Forensic Audit Ledger
  desc: >-
    Append-only, immutable record of agent actions, gate decisions,
    specification evaluations and governed state transitions, kept as
    contemporaneous evidence for regulatory examination.

# --- B. People (BusinessRole -> C4 Person) ---
- type: BusinessRole
  id: role-ea
  name: Enterprise Architect
  desc: Owns principles, target patterns, options and governance decisions.
- type: BusinessRole
  id: role-sa
  name: Solution Architect
  desc: Composes blueprints into solution designs.
- type: BusinessRole
  id: role-sec
  name: Security Architect / Threat Modeller
  desc: Runs threat models over patterns, blueprints and designs.
- type: BusinessRole
  id: role-dev
  name: Developer
  desc: Consumes generated specifications for delivery.
- type: BusinessRole
  id: role-compliance
  name: Compliance Officer / Auditor
  desc: Authors control content and verifies traceability.
- type: BusinessRole
  id: role-ops
  name: Platform Operations (BAU)
  desc: Watches control effectiveness and drift in run.

# --- B. External systems (ApplicationComponent outside the Grouping -> C4 System_Ext) ---
- type: ApplicationComponent
  id: ext-scm
  name: Source Control
  desc: Git repositories for specifications and delivery code.
- type: ApplicationComponent
  id: ext-cicd
  name: CI/CD Pipeline
  desc: Builds, tests and releases; invokes the enforcement gate.
- type: ApplicationComponent
  id: ext-cloud
  name: Cloud & Infrastructure Platforms
  desc: Runtime platforms whose live state feeds the digital twin.
- type: ApplicationComponent
  id: ext-itsm
  name: IT Service Management / Backlog
  desc: Delivery backlog and ticketing (e.g. Jira).
- type: ApplicationComponent
  id: ext-regsources
  name: Regulatory Content Sources
  desc: Upstream NIST OSCAL content and FedRAMP baselines.
- type: ApplicationComponent
  id: ext-trestle
  name: compliance-trestle
  desc: >-
    Third-party Python library/CLI dependency, not vendored source. Performs
    the Trestle Markdown <-> OSCAL round-trip behind fn-oscal-conversion.
- type: ApplicationComponent
  id: ext-llm
  name: LLM Provider
  desc: Language model used for drafting specs, ADRs, evaluations and threat narratives.
- type: ApplicationComponent
  id: ext-rfp
  name: RFP / Vendor Submissions
  desc: >-
    Requests for proposal and competing vendor solution responses assessed at
    engagement time.

# =====================================================================
# C. APPLICATION — the artefact input/output pipeline
#    ApplicationFunctions (the generators/transformers) assigned to their
#    subsystem, reading input artefacts and writing output artefacts via Access.
#    Artefacts are DataObjects, aggregated into the shared stores from section B.
# =====================================================================

# --- C. Functions: Controls & Compliance Catalog ---
- type: ApplicationFunction
  id: fn-policy-authoring
  name: Policy & Standards Authoring
  desc: Author custom policy and standard content as Trestle Markdown catalogs.
- type: ApplicationFunction
  id: fn-oscal-conversion
  name: OSCAL Catalog & Profile Generation
  desc: >-
    Convert authored Markdown and upstream baselines into OSCAL Catalogs and
    Profiles (Trestle round-trip).

# --- C. Functions: Reusable Architecture Library ---
- type: ApplicationFunction
  id: fn-pattern-authoring
  name: Pattern Authoring & Control Mapping
  desc: >-
    Author technology-agnostic architecture patterns and map them to OSCAL
    Profiles.
- type: ApplicationFunction
  id: fn-blueprint-authoring
  name: Blueprint Authoring & Component Mapping
  desc: >-
    Derive implementation blueprints from patterns and map them to OSCAL
    Component Definitions.
- type: ApplicationFunction
  id: fn-solution-compose
  name: Solution Design Composition
  desc: >-
    Compose blueprints and patterns into a solution design and emit its OSCAL
    System Security Plan.
- type: ApplicationFunction
  id: fn-threat-model
  name: Threat Modelling
  desc: >-
    Attach threats and mitigations to patterns, blueprints and solution
    designs.
- type: ApplicationFunction
  id: fn-options-model
  name: Future-State & Options Modelling
  desc: >-
    Model one or more candidate future-state architectures, including competing
    vendor / RFP responses, as decision input for Architecture Governance.

# --- C. Functions: Digital Twin & Knowledge Graph ---
- type: ApplicationFunction
  id: fn-twin-ingest
  name: Digital Twin Ingestion
  desc: >-
    Build the current-state digital twin plane from live infrastructure state
    and deployment events.
- type: ApplicationFunction
  id: fn-ledger-record
  name: Forensic Ledger Recording
  desc: >-
    Append every agent action, gate decision, specification evaluation and
    governed state transition to the append-only Forensic Audit Ledger as
    contemporaneous evidence for regulatory examination.

# --- C. Functions: Architecture Governance ---
- type: ApplicationFunction
  id: fn-governance-eval
  name: Comparative Evaluation & Decision
  desc: >-
    Compare candidate options, assess impact against intent and twin, record the
    ADR, and archive rejected options with rationale.

# --- C. Functions: Conformance & Drift Assurance ---
- type: ApplicationFunction
  id: fn-enforcement-gate
  name: Controls Enforcement Gate
  desc: >-
    Evaluate a release candidate against the expected controls and the solution
    design at release time; block or pass.
- type: ApplicationFunction
  id: fn-effectiveness-monitor
  name: Controls Effectiveness Monitoring
  desc: >-
    Monitor whether deployed controls remain effective in BAU and record the
    evidence.
- type: ApplicationFunction
  id: fn-drift-engine
  name: Drift & Deviation Detection
  desc: >-
    Diff as-designed intent against the current-state twin and classify
    deviations as drift findings.

# --- C. Functions: Modelling & Specification ---
- type: ApplicationFunction
  id: fn-notation-engine
  name: Modelling & Notation Rendering
  desc: Render ArchiMate / C4 / UML models against the bundled metamodels.
- type: ApplicationFunction
  id: fn-spec-generator
  name: Specification Generation
  desc: >-
    Generate development specifications from patterns, blueprints and solution
    designs for spec-driven delivery.

# --- C. Artefacts (DataObject) ---
- {type: DataObject, id: art-policy-doc, name: Policy / Standard Document, desc: Custom policy or standard authored as Trestle Markdown.}
- {type: DataObject, id: art-baseline, name: Regulatory Baseline Catalog, desc: Upstream NIST OSCAL catalog / FedRAMP baseline.}
- {type: DataObject, id: art-oscal-catalog, name: OSCAL Catalog, desc: Machine-readable control catalog.}
- {type: DataObject, id: art-oscal-profile, name: OSCAL Profile, desc: Tailored control selection / baseline.}
- {type: DataObject, id: art-oscal-component, name: OSCAL Component Definition, desc: Control implementation claims for a reusable blueprint.}
- {type: DataObject, id: art-oscal-ssp, name: OSCAL System Security Plan, desc: Control implementation for a specific solution design.}
- {type: DataObject, id: art-pattern, name: Architecture Pattern, desc: Technology-agnostic, reusable design with mapped controls.}
- {type: DataObject, id: art-blueprint, name: Implementation Blueprint, desc: Technology-specific realisation of one or more patterns.}
- {type: DataObject, id: art-solution-design, name: Solution Design, desc: Composed solution — SolutionComponents under a SolutionDesign.}
- {type: DataObject, id: art-threat-model, name: Threat Model, desc: Threats and mitigations attached to a pattern, blueprint or design.}
- {type: DataObject, id: art-infra-state, name: Live Infrastructure State, desc: Observed configuration of the running platforms.}
- {type: DataObject, id: art-deploy-event, name: Deployment Event, desc: A release / deployment recorded by the pipeline.}
- {type: DataObject, id: art-twin, name: Current-State Digital Twin, desc: The as-built plane of the Architecture Knowledge Graph.}
- {type: DataObject, id: art-candidate-arch, name: Candidate Architecture Option, desc: A proposed future-state or vendor solution under evaluation.}
- {type: DataObject, id: art-adr, name: Architecture Decision Record, desc: The chosen option with its rationale and trade-offs.}
- {type: DataObject, id: art-impact-assessment, name: Impact Assessment, desc: Effect of a candidate option on intent and current state.}
- {type: DataObject, id: art-archived-option, name: Archived Rejected Option, desc: A not-chosen option retained with the reasons it lost.}
- {type: DataObject, id: art-release-candidate, name: Release Candidate, desc: A build submitted to the enforcement gate.}
- {type: DataObject, id: art-oscal-assessment-plan, name: OSCAL Assessment Plan, desc: Scope and method for a pre-release assessment run, generated ahead of the gate check and imported by its Assessment Results.}
- {type: DataObject, id: art-oscal-ar, name: OSCAL Assessment Results, desc: Findings on whether an SSP's declared control implementations are satisfied.}
- {type: DataObject, id: art-gate-decision, name: Gate Decision, desc: Pass / block outcome with the controls evaluated — the pre-release instance of an OSCAL Assessment Results.}
- {type: DataObject, id: art-effectiveness-evidence, name: Control Effectiveness Evidence, desc: BAU evidence that a control is (or is not) working — the continuous-monitoring instance of an OSCAL Assessment Results.}
- {type: DataObject, id: art-drift-report, name: Classified Drift Finding, desc: A deviation of current state from intent, classified and prioritised.}
- {type: DataObject, id: art-remediation-item, name: Remediation Backlog Item, desc: A drift finding promoted to actionable delivery work.}
- {type: DataObject, id: art-dev-spec, name: Development Specification, desc: Executable spec derived from patterns, blueprints and designs.}
- {type: DataObject, id: art-metamodel, name: Notation Metamodel, desc: ArchiMate / C4 / UML metamodel used to constrain modelling.}
- {type: DataObject, id: art-ledger-entry, name: Ledger Entry, desc: A single immutable forensic record — actor, action, target artefact, timestamp, outcome.}
