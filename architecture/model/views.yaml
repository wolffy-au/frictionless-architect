- id: view-it4it-capability-bridges
  name: "IT4IT: Capability Bridges"
  # Pure Capability, both first-party cap-* and it4it-cap-* — a clean fit for
  # the standard Capability Map viewpoint.
  viewpoint: capability
  diagram: frictionless-architect-it4it-capability-bridges
  # The traceability layer: every cap-* <-> IT4IT capability Association
  # (props.source: it4it-alignment in relationships.yaml). Deliberately NOT
  # in third_party/it4it/views.yaml — that repo is IT4IT-only content; this
  # view is a cross-*model* cut spanning both repos, so its diagram stays
  # flat at the diagrams/ root rather than living in any one layer folder —
  # unlike cross-layer/subsystem-capabilities, which is only a cross-*layer*
  # cut within this repo's own model and so does get a layer folder.
  # GH #20: this view's own story is the cap-* <-> it4it-cap-* Association
  # bridges, not the first-party capability-to-capability Serving mesh
  # (that's the Capability Map view's story) — exclude it so it doesn't
  # repeat incidentally.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - cap-digital-twin
    - cap-reusable-architecture
