# ArchiMate views — scoping for the diagram-archimate skill.
#
# Each view: id / name / (members: [element ids] and/or include_types: [types])
#            / viewpoint? / diagram?
#
# `build.py` creates the view, adds the matching element nodes, and (if
# `viewpoint:` is set and not `custom`) holds it to that standard ArchiMate
# viewpoint's allowed concepts — a stray concept fails the build. Slugs and
# allow lists:
#   .claude/skills/model-archimate/reference/archi-viewpoints.xml
#   (list them: poetry run python .claude/skills/model-archimate/scripts/viewpoints.py list)
# `viewpoint: custom` = a deliberate cross-layer view; omitting the key skips
# the check.
#
# `exclude:` (optional) suppresses relationships that would otherwise render
# (both endpoints in scope) but are incidental to this view's own story —
# see `build.py::add_views` for the type+pair pattern schema.
#
# `diagram:` is the output path (no extension) under diagrams/ used by
# `render_diagrams.py`. Vision-phase (TOGAF ADM Phase A) views render under
# diagrams/vision/.
#
# Generic one-per-viewpoint views (include_types only) live in
# views-viewpoints.yaml; view ids must be unique across both files.
#
# `context:` (optional, default `[platform]`) lists the element contexts a view's
# `include_types` sweep draws from. Every element has a `context` (default
# `platform`; layers default to their dir name: `it4it`, `gh-roadmap`).
# Explicit `members` are always honoured whatever their context.
#
# The C4 context / container diagrams are NOT views — render_diagrams.py
# projects them via diagram-c4 with --system "Frictionless Architecture Platform".

# =====================================================================
# TOGAF ADM Phase A — Architecture Vision
# =====================================================================

- id: view-context-map
  name: Context Map
  viewpoint: custom
  diagram: overview/context-map
  # GH #129 step 5: the generated bounded-context Groupings
  # (generate_context_groupings, step 2) plus a derived Serving edge between
  # any two contexts that have at least one element-level relationship
  # crossing between them (generate_context_map_relationships) -- direction
  # follows the underlying relationship's own source -> target. Entirely
  # generated: nothing here is hand-authored, so a new context appears on
  # this view automatically the moment an element is tagged with it.
  # include_types sweeps every Grouping in scope; sys-platform (the C4
  # whole-system box, unrelated to bounded contexts) is the only
  # hand-authored Grouping that exists, so it is the only one excluded.
  include_types: [Grouping]
  exclude_elements:
    - {id_prefix: "sys-"}

- id: view-strategy
  name: Strategy
  viewpoint: strategy
  diagram: vision/4-strategy
  no_direction: [Triggering,Flow]
  # Overview: resources -> capabilities -> courses of action, each value
  # stream as a single element, and the outcome it realizes. Stage decomposition and the
  # recipient stakeholders belong to the Value Stream view; the goal linkage
  # (Course of Action -> Goal) is out of scope here — the strategy viewpoint
  # stops at the strategy layer — see Goal Realization for that.
  # Capability and Outcome are include_types, not members — a new
  # first-party element of either type (e.g. cap-conversational-governance,
  # goal-intent-becomes-model-truth) now appears automatically instead of
  # silently staying off the view (GH #117); the default `context: [platform]`
  # scope (every real context, never a vendored layer's) keeps the IT4IT
  # import's vendored Capability/Outcome elements off this platform-only
  # view -- an explicit `exclude_elements: [{id_prefix: "it4it-"}]` here was
  # redundant with that and removed, GH #129 step 7. ValueStream stays
  # members, not include_types — the IT4IT import added 36 more ValueStream
  # elements (7 streams + 29 stages), and this view also deliberately omits
  # first-party stage decomposition (vss-*; that's the Value Stream view's
  # story).
  include_types: [CourseOfAction, Resource, Capability, Outcome, ValueStream]
  # GH #20: the capability-to-capability Serving mesh (control mappings,
  # expected controls, etc.) is the Capability Map view's own story, not
  # this one's — exclude it here so it doesn't repeat incidentally.

- id: view-capability
  name: Capability Map
  viewpoint: capability
  diagram: vision/5-capability-map
  # The eight abilities and the Serving dependency order between them.
  # include_types, not members — a new first-party Capability (e.g.
  # cap-conversational-governance) now appears automatically instead of
  # silently staying off the view (GH #117); the default `context: [platform]`
  # scope keeps the IT4IT import's 42 vendored Capability elements off this
  # platform-only view (see third_party/it4it/views.yaml's
  # view-it4it-capability-map) -- an explicit `exclude_elements:
  # [{id_prefix: "it4it-"}]` here was redundant with that and removed, GH
  # #129 step 7.
  include_types: [Capability]

- id: view-value-stream
  name: Value Stream Hand-offs
  viewpoint: value_stream
  diagram: vision/6-value-stream
  no_direction: [Flow]
  # How the four value streams connect: each parent stream nests its stages
  # (Composition) so every stage is identifiable by stream, with the
  # Triggering sequence within each stream and the Triggering / Flow
  # hand-offs across streams (ADR-0033). Flow edges are left undirected so
  # the layout engine routes the feedback/approval edges between boxes
  # instead of looping them over the top. Each stream's recipients, outcome
  # and serving capabilities are in its own view (6a-6d).
  # include_types, not members — a new first-party ValueStream (e.g.
  # vs-intent-to-model) now appears automatically instead of silently
  # staying off the view (GH #117); the default `context: [platform]` scope
  # keeps the IT4IT import's 36 vendored ValueStream elements (7 streams +
  # 29 stages) off this platform-only view -- an explicit `exclude_elements:
  # [{id_prefix: "it4it-"}]` here was redundant with that and removed, GH
  # #129 step 7. vs-intent-to-model has no internal stage decomposition
  # (ADR-0037 — nothing comparable to decompose within one conversational
  # turn), but it does hand off into vss-baseline like any other stream, so
  # it renders connected into Governed Architecture Delivery, not as a
  # floating box.
  include_types: [ValueStream]

- id: view-vs-governed-delivery
  name: Value Stream — Governed Architecture Delivery
  viewpoint: value_stream
  diagram: vision/6a-governed-delivery
  # One stream on its own: its stages in sequence, the capabilities that
  # serve each stage, the stakeholders it delivers value to, and the outcome
  # it realizes. Hand-offs to other streams are in the Value Stream
  # Hand-offs view.
  # The capability-to-capability Serving mesh is the Capability Map's story.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - vs-governed-delivery
    - vss-baseline
    - vss-specify
    - vss-build
    - vss-release
    - stk-delivery
    - stk-exec
    - outcome-change-lead-time-1day
    - outcome-zero-manual-spec-authoring
    - cap-reusable-architecture
    - cap-spec-engine
    - cap-control-plane

