- id: view-business-controls-catalog
  name: Business — Controls & Compliance Catalog
  viewpoint: business_process_cooperation
  diagram: business/controls-catalog
  # Business-layer-only counterpart of view-artefact-oscal, and (GH #7) the
  # single consolidated picture of a control's journey from authored
  # policy/standard through to operational assurance. Trestle is
  # deliberately not shown — it's the application-layer tool realizing
  # process-oscal-conversion (see fn-oscal-conversion), not a business actor.
  #
  # Formerly two near-duplicate diagrams (this one, role-grouped, and
  # vision/controls-lifecycle, function-grouped) carrying the same objects
  # and relationships. Consolidated by assigning each role to the
  # BusinessFunction it performs (Assignment, relationships.yaml) rather
  # than to the individual process — nesting is then Function > Role >
  # Process wherever one role owns a function outright (e.g.
  # bfn-policy-conversion > role-compliance), and Function > Process where a
  # function's steps split across roles (bfn-pattern-blueprint-traceability
  # has both role-ea and role-sa assigned, so it stays flat with an
  # Assignment arrow to each) or has none (bfn-release-enforcement,
  # bfn-drift-management — automated, no human role assigned).
  members:
    - bfn-policy-conversion
    - role-compliance
    - process-policy-authoring
    - process-oscal-conversion
    - bo-regulatory-standard
    - bo-policy-doc
    - bo-oscal-catalog
    - bo-oscal-profile
    - bfn-pattern-blueprint-traceability
    - role-ea
    - process-pattern-traceability
    - bo-architecture-pattern
    - role-sa
