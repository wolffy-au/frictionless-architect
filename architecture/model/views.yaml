- id: view-outcome-realization
  name: Outcome Realization
  viewpoint: outcome_realization
  diagram: vision/7-outcome-realization
  # How business processes realize capabilities, which serve the value
  # streams, each of which realizes one outcome — the end-to-end realization chain.
  # Capability/ValueStream/Outcome are include_types, not an explicit members
  # allow-list, so a new first-party element of one of these types shows up
  # here automatically instead of silently staying orphaned until someone
  # remembers to add it to this list (GH #108 postmortem: outcome-architect
  # -authored-model and friends did exactly that on first add). The IT4IT
  # import (third_party/it4it) contributes its own Capability/Outcome/
  # ValueStream elements under an `it4it-` id prefix; the default
  # `context: [platform]` scope keeps those off this view (an explicit
  # `exclude_elements: [{id_prefix: "it4it-"}]` here was redundant with that
  # and removed, GH #129 step 7).
  # GH #7/#25: BusinessFunction is also include_types, not members -- no
  # vendored layer contributes one (unlike Capability/Outcome/ValueStream),
  # so there's nothing to filter there either. The 9 bfn-* "major
  # area" groupings (4 from GH #7's controls lifecycle, 3 from GH #25's
  # spec-generation -> build -> release -> drift-discovery -> triage
  # thread, plus bfn-architecture-strategy/bfn-solution-design)
  # Composition-nest their already-realizing processes here automatically.
  # Note: 4 of these capabilities (cap-digital-twin, cap-control-plane,
  # cap-control-catalog, cap-reusable-architecture) appear nested inside a
  # Strategy_Resource box in the Strategy view (Resource --Assignment-->
  # Capability). They render flat here, not nested, because Resource is
  # deliberately out of scope for this view — not a modelling inconsistency.
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's — exclude it so it doesn't repeat.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  # The process chain's own left-to-right order is the Delivery Choreography
  # view's story; here Flow/Triggering are left undirected so the layout is
  # driven by the realization chain (process -> capability -> stage -> outcome).
  no_direction: [Flow, Triggering]
  include_types: [BusinessProcess, BusinessFunction, Capability, ValueStream, Outcome]

- id: view-delivery
  name: Delivery Choreography
  diagram: business/delivery
  # The end-to-end business-process chain (Triggering / Flow hand-offs) —
  # a standard Business Process Cooperation view. Which capability each
  # process realizes is the Outcome Realization view's story, not this one's.
  viewpoint: business_process_cooperation
  include_types: [BusinessProcess]
  # Flow edges are left undirected so the layout engine can place their
  # targets freely instead of looping them back over the chain. Triggering
  # joins it so the chain reads top-to-bottom: graphviz's own default rank
  # direction is top-to-bottom, and REL_DIRECTION's "Right" hint for
  # Triggering was the only thing forcing the left-to-right layout.
  no_direction: [Flow, Triggering]

- id: view-subsystem-capabilities
  name: Subsystems & Capabilities
  diagram: layered/subsystem-capabilities
  # ApplicationComponent -> Capability realization spans the Strategy and
  # Application layers — the standard Layered viewpoint, which exists for
  # showing how layers line up.
  viewpoint: layered
  # Capability is include_types, not members — a new first-party Capability
  # (e.g. cap-conversational-governance) now appears automatically instead
  # of silently staying off the view (GH #117). This view has no explicit
  # `context:`, so its default `[platform]` scope already keeps the IT4IT
  # import's vendored Capability elements off it -- an explicit
  # `exclude_elements: [{id_prefix: "it4it-"}]` here was redundant with that
  # and removed, GH #129 step 7. ApplicationComponent stays members — this
  # view's original 6 subsystems only, not the external systems or the newer
  # sub-llm-provider-config/sub-schema-visualizer, none of which have a
  # Capability realization edge.
  include_types: [Capability]
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's (ApplicationComponent -> Capability) —
  # exclude it so it doesn't repeat incidentally.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - sub-catalog
    - sub-library
    - sub-twin
    - sub-governance
    - sub-assurance
    - sub-modelling

- id: view-gh108-conversational-authoring
  name: "Feature Steel Thread: Conversational Model Authoring (GH #108)"
  viewpoint: layered
  diagram: layered/fn-conversational-authoring
  no_direction: [Influence]
  # Traces this feature end to end through every layer it actually touches,
  # following only edges that already exist in the model (no element was
  # added or re-wired to make this thread connect, except where noted).
  # sub-modelling now realizes a new Strategy capability,
  # cap-conversational-governance, which Serves cap-spec-engine and is
  # Associated with cap-digital-twin — closing the seam the first cut of
  # this view surfaced (sub-modelling had no capability-realization path
  # to the capability process-target-state-definition and #83's
  # bc-model-collaboration both realize). The Technology layer reaches this
  # thread via node-app-server -> art-tech-neo4j-volume -> store-akg
  # (Assignment/Realization, matching the art-tech-oscal-workspace /
  # art-tech-ledger-file pattern elsewhere in the model) with
  # sw-neo4j Assigned to the same artifact — not a direct SystemSoftware ->
  # DataObject edge, which the matrix doesn't permit as Serving/Realization
  # anyway (only Access/Association) and which skipped the Artifact the
  # rest of the model always interposes between a Node and the store it backs.
  #
  # RESOLVED (was an OPEN QUESTION for speckit-specify, later corrected by
  # GH #138): conversational authoring has a standing business process of
  # its own -- process-conversational-authoring, Composed into its own
  # bfn-conversational-authoring (not bfn-architecture-strategy, which
  # would misrepresent it as owned by role-ea's wider remit alone). Despite
  # the generic name, this is role-ea's capability specifically: it edits
  # the candidate architecture graph (do-candidate-arch), which role-sa's
  # canonical journey ("composes solution designs from implementation
  # blueprints") never touches. plan.md's "shared standing process" framing
  # (spec 004) assumed role-sa also used it; GH #138 found no wiring that
  # ever bore that out and gave role-sa its own equivalent instead --
  # process-conversational-solution-modelling, Composed into
  # bfn-solution-design, over do-solution-design. Only bfn-conversational-
  # authoring is Assigned from role-ea now; the sibling role-sa Assignment
  # and this comment's former "jointly Assigned" framing are retired.
  # The process also Realizes cap-conversational-governance directly.
  # The component-level sub-modelling -> role-ea / sub-modelling ->
  # role-sa Serving edges ("converses on model changes with") that used
  # to bypass the business
  # layer are gone -- superseded by this process, not left standing
  # alongside it. if-modelling-authoring-ui still Serves both role-ea and
  # role-sa (each "propose, review & apply model changes") because it is
  # now shared infrastructure: fn-conversational-authoring exposes role-ea's
  # path through it, fn-solution-modelling exposes role-sa's.
  members:
    - stk-architecture
    - driver-sustainability
    - driver-authoring-friction
    - assess-drift-debt
    - assess-manual-authoring-risk
    - goal-drift-reconciled
    - goal-intent-becomes-model-truth
    - goal-frictionless-architecture
    - outcome-drift-zero-aged-backlog
    - outcome-zero-hand-edited-model
    - req-authoritative-twin
    - req-conversational-authoring-alignment
    - cap-digital-twin
    - cap-conversational-governance
    - res-akg
    - res-ea-practice
    - bfn-architecture-strategy
    - process-target-state-definition
    - bfn-conversational-authoring
    - process-conversational-authoring
    - role-ea
    - role-sa
    - sub-twin
    - sub-modelling
    - fn-conversational-authoring
    - fn-notation-engine
    - do-metamodel
    - do-candidate-arch
    - store-akg
    - sw-neo4j
    - art-tech-neo4j-volume
    - node-app-server

