# ArchiMate views — scoping for the diagram-archimate skill.
#
# Each view: id / name / (members: [element ids] and/or include_types: [types])
#            / viewpoint? / diagram?
#
# `build.py` creates the view, adds the matching element nodes, and (if
# `viewpoint:` is set and not `custom`) holds it to that standard ArchiMate
# viewpoint's allowed concepts — a stray concept fails the build. Slugs and
# allow lists:
#   .claude/skills/model-archimate/reference/archi-viewpoints.xml
#   (list them: poetry run python .claude/skills/model-archimate/scripts/viewpoints.py list)
# `viewpoint: custom` = a deliberate cross-layer view; omitting the key skips
# the check.
#
# `exclude:` (optional) suppresses relationships that would otherwise render
# (both endpoints in scope) but are incidental to this view's own story —
# see `build.py::add_views` for the type+pair pattern schema.
#
# `diagram:` is the output path (no extension) under diagrams/ used by
# `render_diagrams.py`. Vision-phase (TOGAF ADM Phase A) views render under
# diagrams/vision/.
#
# The C4 context / container diagrams are NOT views — render_diagrams.py
# projects them via diagram-c4 with --system "Frictionless Architecture Platform".

# =====================================================================
# TOGAF ADM Phase A — Architecture Vision
# =====================================================================

- id: view-stakeholder
  name: Stakeholder
  viewpoint: stakeholder
  diagram: vision/1-stakeholder
  # The case for change: who holds which driver, the assessments that make each
  # driver urgent, and the goal + outcome they drive toward.
  # Outcome and Stakeholder are scoped explicitly (not via include_types)
  # because the IT4IT import added a second Outcome element
  # (it4it-outcome-digital-product) and 24 more Stakeholder elements —
  # an include_types: [..., Outcome/Stakeholder] here would pull them into a
  # platform-only view. Same fix applies everywhere below
  # Outcome/Capability/ValueStream/Stakeholder appear in include_types.
  include_types: [Assessment, Driver, Goal]
  members:
    - outcome-executable-intelligence
    - stk-exec
    - stk-regulator
    - stk-architecture
    - stk-delivery
    - stk-risk-compliance

- id: view-motivation
  name: Motivation
  viewpoint: motivation
  diagram: vision/2-motivation
  # The whole motivation model — stakeholders, assessments, drivers, goal,
  # outcome, principles, requirements, constraints — and how they relate.
  # Stakeholder scoped explicitly (not via include_types), same reason as
  # view-stakeholder above — the IT4IT import added 24 more Stakeholder
  # elements that an include_types: [Stakeholder, ...] would pull in here.
  include_types:
    [Assessment, Driver, Goal, Principle, Requirement, Constraint]
  members:
    - outcome-executable-intelligence
    - stk-exec
    - stk-regulator
    - stk-architecture
    - stk-delivery
    - stk-risk-compliance

- id: view-goal-realization
  name: Goal Realization
  viewpoint: goal_realization
  diagram: vision/3-goal-realization
  # How the goal refines into the outcome, and how principles, requirements and
  # constraints realize it.
  include_types: [Goal, Principle, Requirement, Constraint]
  members:
    - outcome-executable-intelligence

- id: view-strategy
  name: Strategy
  viewpoint: strategy
  diagram: vision/4-strategy
  # Overview: resources -> capabilities -> courses of action, the value stream
  # as a single element, and the outcome. Stage decomposition and the
  # recipient stakeholders belong to the Value Stream view; the goal linkage
  # (Course of Action -> Goal) is out of scope here — the strategy viewpoint
  # stops at the strategy layer — see Goal Realization for that.
  # Capability is scoped via members, not include_types — see the note on
  # view-stakeholder above; the IT4IT import added 42 more Capability elements.
  include_types: [CourseOfAction, Resource]
  # GH #20: the capability-to-capability Serving mesh (control mappings,
  # expected controls, etc.) is the Capability Map view's own story, not
  # this one's — exclude it here so it doesn't repeat incidentally.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - vs-governed-delivery
    - outcome-executable-intelligence
    - cap-digital-twin
    - cap-spec-engine
    - cap-control-plane
    - cap-forensic-ledger
    - cap-drift-dashboard
    - cap-human-approval-workflow
    - cap-control-catalog
    - cap-reusable-architecture

- id: view-capability
  name: Capability Map
  viewpoint: capability
  diagram: vision/5-capability-map
  # The eight abilities and the Serving dependency order between them.
  # Members, not include_types — the IT4IT import added 42 more Capability
  # elements (see third_party/it4it/views.yaml's view-it4it-capability-map).
  members:
    - cap-digital-twin
    - cap-spec-engine
    - cap-control-plane
    - cap-forensic-ledger
    - cap-drift-dashboard
    - cap-human-approval-workflow
    - cap-control-catalog
    - cap-reusable-architecture

- id: view-value-stream
  name: Value Stream — Governed Architecture Delivery
  viewpoint: value_stream
  diagram: vision/6-value-stream
  # The stream and its six stages (Composition + Triggering sequence, with the
  # Reconcile→Specify feedback Flow), the capabilities that Serve each stage,
  # the recipient stakeholders the stream delivers value to, and the Outcome it
  # Realizes. Resources and courses of action belong to the Strategy view.
  # ValueStream is scoped via members, not include_types — the IT4IT import
  # added 36 more ValueStream elements (7 streams + 29 stages).
  # Note: 4 of these capabilities (cap-digital-twin, cap-control-plane,
  # cap-control-catalog, cap-reusable-architecture) appear nested inside a
  # Strategy_Resource box in the Strategy view (Resource --Assignment-->
  # Capability). They render flat here, not nested, because Resource is
  # deliberately out of scope for this view — not a modelling inconsistency.
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's — exclude it so it doesn't repeat.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - vs-governed-delivery
    - vss-baseline
    - vss-specify
    - vss-build
    - vss-prove
    - vss-release
    - vss-reconcile
    - cap-control-catalog
    - cap-reusable-architecture
    - cap-digital-twin
    - cap-spec-engine
    - cap-control-plane
    - cap-forensic-ledger
    - cap-human-approval-workflow
    - cap-drift-dashboard
    - stk-delivery
    - stk-architecture
    - stk-risk-compliance
    - outcome-executable-intelligence

- id: view-outcome-realization
  name: Outcome Realization
  viewpoint: outcome_realization
  diagram: vision/7-outcome-realization
  # How business processes realize capabilities, which serve the value stream,
  # which realizes the outcome — the end-to-end realization chain.
  # Capability/ValueStream scoped via members, not include_types — see notes
  # above; the IT4IT import added elements of both types.
  # GH #7: the four bfn-* BusinessFunctions are added as members (not via
  # include_types — BusinessFunction is a different type from the
  # BusinessProcess this view otherwise auto-includes) so the "major area"
  # groupings Composition-nest their already-realizing processes here too.
  # GH #25: same rationale for the 3 bfn-* BusinessFunctions grouping the
  # spec-generation -> build -> release -> drift-discovery -> triage thread,
  # a separate lifecycle from GH #7's controls-lifecycle groupings.
  # Note: 4 of these capabilities (cap-digital-twin, cap-control-plane,
  # cap-control-catalog, cap-reusable-architecture) appear nested inside a
  # Strategy_Resource box in the Strategy view (Resource --Assignment-->
  # Capability). They render flat here, not nested, because Resource is
  # deliberately out of scope for this view — not a modelling inconsistency.
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's — exclude it so it doesn't repeat.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  include_types: [BusinessProcess]
  members:
    - outcome-executable-intelligence
    - vs-governed-delivery
    - vss-baseline
    - vss-specify
    - vss-build
    - vss-prove
    - vss-release
    - vss-reconcile
    - cap-digital-twin
    - cap-spec-engine
    - cap-control-plane
    - cap-forensic-ledger
    - cap-drift-dashboard
    - cap-human-approval-workflow
    - cap-control-catalog
    - cap-reusable-architecture
    - bfn-policy-conversion
    - bfn-pattern-blueprint-traceability
    - bfn-release-enforcement
    - bfn-effectiveness-assurance
    - bfn-agentic-delivery
    - bfn-release-management
    - bfn-drift-management

# =====================================================================
# Cross-cutting / later-phase views
# =====================================================================

- id: view-skeleton
  name: Architecture Skeleton
  diagram: cross-layer/skeleton
  # The load-bearing subset (ADR-0010): motivation spine + the capabilities it
  # drives. A deliberate cross-layer cut — no standard viewpoint spans
  # motivation elements and Capability together.
  # Outcome/Capability scoped via members, not include_types — see the note
  # on view-stakeholder above; the IT4IT import added elements of both types.
  viewpoint: custom
  include_types: [Driver, Goal, Principle, Constraint, Requirement]
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's (motivation spine -> capabilities) —
  # exclude it so it doesn't repeat incidentally.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - outcome-executable-intelligence
    - cap-digital-twin
    - cap-spec-engine
    - cap-control-plane
    - cap-forensic-ledger
    - cap-drift-dashboard
    - cap-human-approval-workflow
    - cap-control-catalog
    - cap-reusable-architecture

- id: view-delivery
  name: Delivery Choreography
  diagram: cross-layer/delivery
  # BusinessProcess -> Capability realization: the standard viewpoint whose
  # allow-list spans both (Capability + $BusinessElements$) is Outcome
  # Realization, even though no Outcome element sits on this particular view.
  viewpoint: outcome_realization
  include_types: [BusinessProcess]
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's (BusinessProcess -> Capability) —
  # exclude it so it doesn't repeat incidentally.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - cap-spec-engine
    - cap-control-plane
    - cap-drift-dashboard
    - cap-control-catalog
    - cap-forensic-ledger
    - cap-human-approval-workflow

- id: view-subsystem-capabilities
  name: Subsystems & Capabilities
  diagram: cross-layer/subsystem-capabilities
  # ApplicationComponent -> Capability realization: the standard viewpoint
  # whose allow-list spans both (Capability + $ApplicationElements$) is
  # Outcome Realization, even though no Outcome element sits on this view.
  viewpoint: outcome_realization
  # GH #20: the capability-to-capability Serving mesh is the Capability Map
  # view's own story, not this one's (ApplicationComponent -> Capability) —
  # exclude it so it doesn't repeat incidentally.
  exclude:
    - {type: Serving, source_type: Capability, target_type: Capability}
  members:
    - sub-catalog
    - sub-library
    - sub-twin
    - sub-governance
    - sub-assurance
    - sub-modelling
    - cap-control-catalog
    - cap-reusable-architecture
    - cap-digital-twin
    - cap-forensic-ledger
