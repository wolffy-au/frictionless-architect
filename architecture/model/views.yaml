# ArchiMate views — minimal scoping for the diagram-archimate skill.
#
# Each view: id / name / (members: [element ids] and/or include_types: [types]).
# `build.py` creates the view and adds the matching element nodes; the
# diagram-archimate skill renders one with:
#   poetry run python .agents/skills/diagram-archimate/scripts/model_to_puml.py \
#     architecture/model/frictionless-architect.xml --view "<name>" -o <out>.puml
#
# The C4 context / container diagrams are NOT views — they are projected by
# diagram-c4 with --system "Frictionless Architecture Platform".
#
# (The richer view schema — kind, auto-membership rules — is deferred.)

- id: view-skeleton
  name: Architecture Skeleton
  include_types: [Driver, Goal, Outcome, Principle, Constraint, Requirement, Capability]

# The capability layer in focus: capability-to-capability value chains, the
# Governed Architecture Delivery value stream and its stages, and the outcome /
# goal the stream realizes.
- id: view-capability-map
  name: Capability Map & Value Stream
  include_types: [Capability, ValueStream]
  members:
    - outcome-executable-intelligence
    - goal-frictionless-architecture

# The end-to-end delivery choreography and the capabilities the processes realize.
- id: view-delivery
  name: Delivery Choreography
  include_types: [BusinessProcess]
  members:
    - cap-spec-engine
    - cap-control-plane
    - cap-drift-dashboard

# The whole ecosystem is better seen as the C4 container diagram (diagram-c4).
# This view isolates just the subsystem -> strategy-capability realization, the
# bridge between the application view and the skeleton.
- id: view-subsystem-capabilities
  name: Subsystems & Capabilities
  members:
    - sub-catalog
    - sub-library
    - sub-twin
    - sub-governance
    - sub-assurance
    - sub-modelling
    - cap-control-catalog
    - cap-reusable-architecture
    - cap-digital-twin
    - cap-forensic-ledger
    - cap-spec-engine
    - cap-control-plane
    - cap-drift-dashboard
    - cap-human-approval-workflow

