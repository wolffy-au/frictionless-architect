- id: view-packaging
  name: Packaging
  diagram: implementation/packaging
  # Packages (Artifacts) realising the components they ship, plus the
  # runtime SystemSoftware that hosts them (GH #55). Its Node
  # (node-app-server) is deliberately not a member — the
  # implementation_deployment viewpoint's allowed-concept list doesn't
  # include Node — see view-technology-ci-check for the same constraint on
  # node-ci-runner.
  viewpoint: implementation_deployment
  # Subsystem-to-subsystem cooperation is the Artefact Flow views' story,
  # not packaging's — exclude it so it doesn't render incidentally.
  exclude:
    - {type: Serving, source_type: ApplicationComponent, target_type: ApplicationComponent}
    - {type: Flow, source_type: ApplicationComponent, target_type: ApplicationComponent}
    - {type: Association, source_type: ApplicationComponent, target_type: ApplicationComponent}
  # include_types: [Artifact] would also sweep in the non-package Artifacts
  # added for GH #55's persistence-boundary slice (art-tech-oscal-workspace,
