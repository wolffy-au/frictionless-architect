# Frictionless Architecture & Governance Platform — model relationships
#
# Schema:  type / source / target / label? / props?
#   type    ArchiMate 3.2 relationship name (Realization, Triggering, Serving,
#           Flow, Access, Association, Composition, Aggregation, Assignment,
#           Influence, Specialization), case-insensitive
#   source  element id      target  element id
#   label   optional text shown on ArchiMate diagrams / used as the C4 edge label
#   props   access_type (Read|Write|ReadWrite) for Access;
#           c4-label overrides `label` in the C4 projection only
#
# Every (source, type, target) pair is held to the ArchiMate 3.2 relationship
# matrix by `.claude/skills/model-archimate/scripts/validate.py` (run by build.py).

# =====================================================================
# A. Capability realizes its functional requirement (component -> contract)
#    Every capability realizes at least one requirement.
# =====================================================================
- type: Realization
  source: cap-spec-engine
  target: req-auto-spec-generation
- type: Realization
  source: cap-control-catalog          # obligation mapping is a catalog concern
  target: req-regulatory-mapping
- type: Realization
  source: cap-control-plane
  target: req-pre-deploy-gate
- type: Realization
  source: cap-drift-dashboard
  target: req-continuous-reconciliation
- type: Realization
  source: cap-human-approval-workflow
  target: req-human-signoff
- type: Realization
  source: cap-control-catalog
  target: req-control-catalog
- type: Realization
  source: cap-reusable-architecture
  target: req-reusable-architecture
- type: Realization
  source: cap-digital-twin
  target: req-authoritative-twin
- type: Realization
  source: cap-forensic-ledger
  target: req-immutable-audit-ledger

