# Stage sequence within each stream (Triggering), then the hand-offs between
# streams. A change runs baseline -> specify -> build -> prove -> release;
# prove escalates what it cannot validate deterministically, and the
# sign-off returns to release as a Flow (an approval, not a second trigger —
# a Triggering there would make prove -> release derived via the escalation
# path). A release triggers observation of the new as-built state, and
# reconciled drift re-enters delivery as a new change to specify.
- {type: Triggering, source: vss-baseline, target: vss-specify}
- {type: Triggering, source: vss-specify, target: vss-build}
- {type: Triggering, source: vss-control-baseline, target: vss-prove}
- {type: Triggering, source: vss-escalate, target: vss-signoff}
- {type: Triggering, source: vss-signoff, target: vss-record}
- {type: Triggering, source: vss-observe, target: vss-reconcile}
- {type: Triggering, source: vss-build, target: vss-prove}
- {type: Triggering, source: vss-prove, target: vss-release}
- {type: Triggering, source: vss-prove, target: vss-escalate, label: not deterministically validated}
- {type: Flow, source: vss-signoff, target: vss-release, label: approval}
- {type: Triggering, source: vss-release, target: vss-observe}
- {type: Flow, source: vss-reconcile, target: vss-specify, label: drift remediation re-enters}

