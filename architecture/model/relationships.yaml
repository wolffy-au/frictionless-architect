# =====================================================================
# A. Assessments influence the outcome that answers them (above), never a
#    requirement: an Assessment -> Requirement Influence would make the
#    Assessment -> Outcome edge derived (via requirement -> outcome), and the
#    Stakeholder view — whose viewpoint admits no Requirement — needs
#    Assessment -> Outcome to show which concern each outcome answers.
#    Requirements are motivated by the principles and constraints below, and
#    justified by the outcome they realize.
# =====================================================================

# =====================================================================
# A. Principles and constraints each influence the ONE requirement that most
#    directly operationalises them — kept to one edge apiece so the
#    Motivation view stays readable. They reach outcomes and the goal only
#    via that requirement (a direct edge would be derived). Requirements with
#    no influence here (spec generation, reusable architecture, continuous
#    reconciliation) are justified by the outcome they realize.
# =====================================================================
- {type: Influence, source: principle-human-accountability, target: req-human-signoff}
- {type: Influence, source: principle-forensic-audit, target: req-immutable-audit-ledger}
