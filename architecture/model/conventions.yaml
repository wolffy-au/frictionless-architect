# Enterprise Convention Rules (GH #108, ADR-0037 R6/R13) — organisation-specific
# authoring conventions the conversational agent validates proposed deltas against,
# alongside (not instead of) the fixed ArchiMate 3.2 metamodel rules pyArchimate
# enforces. Schema (specs/004-conversational-model-authoring/data-model.md):
#
# - id:      string, e.g. `conv-naming-camel-free`
# - kind:    naming | altitude | allowed-subset | interposed-pattern
# - scope:   list of ArchiMate type names, or `*`
# - params:  kind-specific —
#     interposed-pattern: {source_type, relationship_type, target_type, intermediary_types[]}
#     naming:             {pattern}        — a regex the proposed `name` MUST match
#     altitude:           {banned_terms[]} — `name`/`desc` MUST NOT contain any of these
#     allowed-subset:     {allowed_types[]} — the proposed type MUST be one of these
# - enabled: bool, default true — turn a rule off without deleting it
#
# Aggregated under `store-frameworks` as `do-convention-rules` (plan.md Model impact),
# same pattern as `do-metamodel`. A malformed entry fails validation naming the
# offending `id`, never silently skipped (FR-007's "never silently" posture).

- id: conv-interposed-neo4j-volume
  kind: interposed-pattern
  scope: ["*"]
  params:
    source_type: SystemSoftware
    relationship_type: Assignment
    target_type: DataObject
    intermediary_types: [Artifact]
  enabled: true
