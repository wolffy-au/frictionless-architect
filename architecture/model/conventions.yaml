# Enterprise Convention Rules (GH #108, ADR-0037 R6/R13) — organisation-specific
# authoring conventions the conversational agent validates proposed deltas against,
# alongside (not instead of) the fixed ArchiMate 3.2 metamodel rules pyArchimate
# enforces. Schema (specs/004-conversational-model-authoring/data-model.md):
#
# - id:      string, e.g. `conv-naming-camel-free`
# - kind:    naming | altitude | allowed-subset | interposed-pattern |
#            required-neighbour | no-bypass
# - scope:   list of ArchiMate type names, or `*`
# - params:  kind-specific —
#     interposed-pattern: {source_type, relationship_type, target_type, intermediary_types[],
#                          target_relationship_type} — target_relationship_type is the type
#                          of the intermediary -> target leg, which need not match
#                          relationship_type (the source -> intermediary leg); see the
#                          sw-neo4j -> art-tech-neo4j-volume (Assignment) -> store-akg
#                          (Realization) precedent below.
#     naming:             {pattern}        — a regex the proposed `name` MUST match
#     altitude:           {banned_terms[]} — `name`/`desc` MUST NOT contain any of these
#     allowed-subset:     {allowed_types[]} — the proposed type MUST be one of these
#     required-neighbour: {relationship_type, direction (incoming|outgoing),
#                          neighbour_type, first_party_only?, exclude_ids[]} — every element
#                          in scope must have a matching relationship to an
#                          element of neighbour_type.
#     no-bypass:          {source_type, intermediary_type, first_party_only?} —
#                          source_type elements may only have outgoing
#                          relationships to intermediary_type elements.
# - enabled: bool, default true — turn a rule off without deleting it
#
# Aggregated under `store-frameworks` as `do-convention-rules` (plan.md Model impact),
# same pattern as `do-metamodel`. A malformed entry fails validation naming the
# offending `id`, never silently skipped (FR-007's "never silently" posture).

# Complements, doesn't duplicate, the skill's check_derived.py: that script
# is a whole-model, run-by-hand/CI *audit* for direct edges a formal
# ArchiMate derivation rule (pyArchimate.derivation, DR2/DR3/DR5/DR7/DR8)
# already implies, found *after* they're committed. interposed-pattern rules
# here are the opposite direction — a single candidate delta, checked
# *before* it's applied, for shapes this enterprise has decided should
# always go through an intermediary even where no formal derivation rule
# forces it. Each one is typically seeded from a check_derived.py finding or
# an existing precedent (this one, from sw-neo4j -> art-tech-neo4j-volume ->
# store-akg) once a reviewer decides the shape should be enforced going
# forward, not just flagged after the fact.
- id: conv-interposed-neo4j-volume
  kind: interposed-pattern
  scope: ["*"]
  params:
    source_type: SystemSoftware
    relationship_type: Assignment
    target_type: DataObject
    intermediary_types: [Artifact]
    target_relationship_type: Realization
  enabled: true

# Caught by hand once already: outcome-architect-authored-model's desc read
# "...without a manual YAML edit or render step..." before its GH #108 rename
# to goal-intent-becomes-model-truth — tooling vocabulary at the wrong
# altitude for the case-for-change layer. "agent"/"agentic" stay unbanned;
# driver-scaling, assess-review-bottleneck and goal-accountable-automation
# already use them as a legitimate business concept, not a tooling leak.
- id: conv-altitude-motivation-no-tooling
  kind: altitude
  scope: [Goal, Outcome, Driver, Assessment]
  params:
    banned_terms: ["YAML", "render step"]
  enabled: true

# Naming — every Motivation/Strategy element in this model names the thing
# itself, never restates its own ArchiMate type (e.g. the Capability is
# "Architecture Knowledge Management", never "Architecture Knowledge
# Management Capability"). Verified against all 76 existing elements of
# these 11 types with zero exceptions before adding — this is description,
# not aspiration. Each rule bans its own type's word via a MUST-match
# negative-lookahead regex (the schema has no banned-terms-per-type kind;
# `altitude`'s banned_terms are global across its whole scope list, which
# would be wrong here since each type's banned word differs).
- id: conv-naming-no-self-type-capability
  kind: naming
  scope: [Capability]
  params:
    pattern: "(?i)^(?!.*\\bcapability\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-requirement
  kind: naming
  scope: [Requirement]
  params:
    pattern: "(?i)^(?!.*\\brequirement\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-outcome
  kind: naming
  scope: [Outcome]
  params:
    pattern: "(?i)^(?!.*\\boutcome\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-driver
  kind: naming
  scope: [Driver]
  params:
    pattern: "(?i)^(?!.*\\bdriver\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-goal
  kind: naming
  scope: [Goal]
  params:
    pattern: "(?i)^(?!.*\\bgoal\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-principle
  kind: naming
  scope: [Principle]
  params:
    pattern: "(?i)^(?!.*\\bprinciple\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-constraint
  kind: naming
  scope: [Constraint]
  params:
    pattern: "(?i)^(?!.*\\bconstraint\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-stakeholder
  kind: naming
  scope: [Stakeholder]
  params:
    pattern: "(?i)^(?!.*\\bstakeholder\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-assessment
  kind: naming
  scope: [Assessment]
  params:
    pattern: "(?i)^(?!.*\\bassessment\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-course-of-action
  kind: naming
  scope: [CourseOfAction]
  params:
    pattern: "(?i)^(?!.*\\bcourse of action\\b).+$"
  enabled: true
- id: conv-naming-no-self-type-value-stream
  kind: naming
  scope: [ValueStream]
  params:
    pattern: "(?i)^(?!.*\\bvalue stream\\b).+$"
  enabled: true

# Whole-model motivation structure. These are organisation-specific
# completeness policies, not ArchiMate metamodel constraints; disable or
# change the individual rules when the intended model shape changes.
- id: conv-driver-held-by-stakeholder
  kind: required-neighbour
  scope: [Driver]
  params:
    relationship_type: Association
    direction: incoming
    neighbour_type: Stakeholder
    first_party_only: true
  enabled: true
- id: conv-driver-associated-with-assessment
  kind: required-neighbour
  scope: [Driver]
  params:
    relationship_type: Association
    direction: outgoing
    neighbour_type: Assessment
    first_party_only: true
  enabled: true
- id: conv-assessment-associated-with-driver
  kind: required-neighbour
  scope: [Assessment]
  params:
    relationship_type: Association
    direction: incoming
    neighbour_type: Driver
    first_party_only: true
  enabled: true
- id: conv-assessment-associated-with-goal
  kind: required-neighbour
  scope: [Assessment]
  params:
    relationship_type: Association
    direction: outgoing
    neighbour_type: Goal
    first_party_only: true
  enabled: true
- id: conv-goal-associated-with-assessment
  kind: required-neighbour
  scope: [Goal]
  params:
    relationship_type: Association
    direction: incoming
    neighbour_type: Assessment
    first_party_only: true
    exclude_ids: [goal-frictionless-architecture]
  enabled: true
- id: conv-outcome-realizes-goal
  kind: required-neighbour
  scope: [Outcome]
  params:
    relationship_type: Realization
    direction: outgoing
    neighbour_type: Goal
    first_party_only: true
  enabled: true
- id: conv-outcome-realized-by-requirement
  kind: required-neighbour
  scope: [Outcome]
  params:
    relationship_type: Realization
    direction: incoming
    neighbour_type: Requirement
    first_party_only: true
  enabled: true
- id: conv-capability-realizes-requirement
  kind: required-neighbour
  scope: [Capability]
  params:
    relationship_type: Realization
    direction: outgoing
    neighbour_type: Requirement
    first_party_only: true
  enabled: true
- id: conv-driver-routes-through-assessment
  kind: no-bypass
  scope: [Driver]
  params:
    source_type: Driver
    intermediary_type: Assessment
    first_party_only: true
  enabled: true
