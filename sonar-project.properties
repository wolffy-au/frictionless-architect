sonar.projectKey=wolffy-au_frictionless-architect
sonar.organization=wolffy-au
sonar.host.url=https://sonarcloud.io
sonar.python.coverage.reportPaths=build/coverage.xml,build/platform-coverage-*.xml
sonar.python.version=3.12
# platform/packages/<name>/ hold both src/ and tests/ — the inclusions and
# exclusions below split them (ADR-0002, ARCHITECTURE.md §3.2).
sonar.sources=src,platform/packages
sonar.tests=tests,platform/packages
sonar.test.inclusions=tests/**/*.py,platform/packages/*/tests/**/*.py
sonar.coverage.exclusions=src/frictionless_architect/visualizer/static/**/*.js,src/frictionless_architect/visualizer/templates/**/*.html
# Vendored git submodules (third_party/) are read-only reference content, not
# first-party code — exclude them from every analyzer, including the
# project-wide ones (secrets, duplication) that ignore sonar.sources.
sonar.exclusions=third_party/**,platform/packages/*/tests/**
# Packages under platform/packages/ share one platform/poetry.lock (ADR-0002),
# so S8565 ("lock file missing") is a false positive for their pyproject.toml.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.e1.resourceKey=platform/packages/*/pyproject.toml
