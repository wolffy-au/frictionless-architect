notes: >
  These profiles' `import`/`include-controls` sections reference control ids
  across the full 800-53 catalog, including the entire ac-* and au-* families.
  Resolving them against ../catalog/nist-sp800-53-rev5-catalog-ac-au-excerpt.json
  will work for exactly the AC and AU controls/enhancements pulled into each
  baseline; resolving against any control id outside those two families will
  fail since the excerpt catalog only contains AC and AU.
