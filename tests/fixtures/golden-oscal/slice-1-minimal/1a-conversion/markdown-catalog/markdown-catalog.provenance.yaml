  Trestle Markdown (bypassing AI conversion)" — to test the assemble step
  without needing a working AI-conversion pipeline first. This is NOT a
  round-trip/regression fixture; it exists purely as ready-made valid input
  for testing the assemble step, generated by trestle itself from the golden
  catalog rather than hand-crafted or produced by this project's own
  (not-yet-built) AI converter.

