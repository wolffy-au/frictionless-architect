  This is the "Trestle-editable Markdown Catalog" intermediate artefact from
  spec 003-oscal-ai-conversion (see the Key Entities section on
  wip/oscal-conversion): the form AI conversion is expected to produce, and
  what `trestle author catalog-assemble` consumes to (re)produce an OSCAL
