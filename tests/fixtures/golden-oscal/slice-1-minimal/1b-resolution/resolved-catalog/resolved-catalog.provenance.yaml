notes: >
  Entry counts confirm the two variation patterns ../../README.md documents:
  LOW has 2 entries (ac-2, au-2 — no AC-2 enhancements, no IA-3); MODERATE
  has 4 (adds ac-2.1 and ia-3); HIGH has 5 (adds ac-2.11). This matches the
  per-tier `ac-2` family selection already recorded in
  ../../catalog/nist-sp800-53-rev5-catalog-excerpt.provenance.yaml, now
  verified end-to-end by actually running profile-resolve rather than just
  reading each profile's `include-controls` list.

  This resolved-catalog output is NOT a valid comparison target for
  FR-007/SC-003-style checks against the vendored FedRAMP baselines — see
  the 2026-09-28 "Known issue" note in docs/adr/0030-vendor-oscal-reference-
  content.md (the vendored FedRAMP content is SP 800-53 rev4, this is rev5).
