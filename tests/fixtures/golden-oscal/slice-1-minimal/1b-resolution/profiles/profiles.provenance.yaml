extraction_method: >
  Verbatim full-file copy, not excerpted — each profile file is only 7-12 KB
  in its entirety (it's a selection/tailoring document, not a catalog), so
  there is nothing smaller than the full file to vendor even at slice-1 scale.
  PRIVACY baseline omitted here (kept at slice-3 only) since it isn't part of
  the AC-2/AU-2/IA-3 cross-baseline comparison this slice is built around.
