notes: >
  These profiles' `import`/`include-controls` sections reference control ids
  ac-2, au-2, ia-3 (among many others, since they're unmodified copies of the
  real full baseline profiles) against the full catalog.

  2026-09-28 revision: these profiles cannot be resolved directly against
  ../../catalog/nist-sp800-53-rev5-catalog-excerpt.json — each profile's
  `include-controls` selects a different, and generally larger, set of AC-2
  enhancements than the excerpt catalog keeps (the excerpt only retains
  ac-2.1/ac-2.11 as ac-2's children). The actual resolved-catalog excerpts
  under ../resolved-catalog/ were produced by running `trestle author
  profile-resolve` against the real, complete slice-3-full catalog and a
  locally href-retargeted scratch copy of each profile, then hand-trimming
  the result down to the 5 tracked ids — see
  ../resolved-catalog/resolved-catalog.provenance.yaml for the exact method.
