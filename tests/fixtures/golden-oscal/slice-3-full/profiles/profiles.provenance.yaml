notes: >
  These are what FIPS 200 / FIPS 199 operationalize (see ../../standards): FIPS
  199 sets the LOW/MODERATE/HIGH impact-level scheme, FIPS 200 sets minimum
  requirement families, and these OSCAL profiles are NIST's control-baseline
  implementation of that scheme for SP 800-53 Rev 5. FedRAMP's baselines
  (../fedramp) further tailor these.
