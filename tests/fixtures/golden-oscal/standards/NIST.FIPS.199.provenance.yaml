notes: >
  FIPS 199 has no OSCAL representation of its own — NIST never published one.
  It defines the LOW/MODERATE/HIGH impact-level categorization scheme that
  FIPS 200 and the SP 800-53B baselines (vendored under
  ../slice-1-minimal/profiles and ../slice-3-full/profiles) operationalize.
  Vendored here as background/QA context, not as a source of OSCAL prose.
