# wiki/sources.yaml — declares what the project wiki is built from.
#
# Edit THIS file; everything else under wiki/ is generated by the
# `wiki-librarian` skill and will be overwritten on rebuild.
#
# Each topic becomes wiki/<name>.md. A source is either:
#   - path: <glob>     a repo file or glob, relative to the repo root ('**' ok)
#   - url:  <url>       an external document, fetched and cached at build time
#     title: <text>
#
# After editing, run the librarian to (re)build, then:
#   python .claude/skills/wiki-librarian/tools/build_status.py --coverage

topics:
  - name: project-overview
    title: Project Overview
    description: What Frictionless Architect is, who it's for, and its scope.
    sources:
      - path: README.md
      - path: PROJECT_SPECIFICATION.md

  - name: governance-and-constitution
    title: Governance & Constitution
    description: The project's constitutional rules and quality gates.
    sources:
      - path: PROJECT_CONSTITUTION.md
      - path: .specify/memory/constitution.md

  - name: architecture
    title: Architecture Overview
    description: How the platform is layered, and the load-bearing decisions.
    sources:
      - path: ARCHITECTURE.md
      - path: TECHNICAL.md
      - path: docs/adr/*.md

  - name: architecture-model
    title: Architecture Model
    description: The canonical graph-loadable YAML model (skeleton + 6 subsystems + artefact flow + IT4IT alignment) that every ArchiMate/C4 diagram is generated from.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/elements.yaml
      - path: architecture/model/relationships.yaml
      - path: architecture/model/views.yaml

  - name: architecture-diagrams
    title: Architecture Views & Diagrams
    description: How the model's ArchiMate views map to viewpoints and rendered C4/PlantUML diagrams, and how to regenerate them.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/views.yaml
      - path: architecture/model/diagrams/**

  - name: it4it-model
    title: IT4IT Reference Model
    description: The vendored IT4IT 3.0 value-stream reference model (third_party/it4it) and how it's merged into the platform's own architecture model.
    sources:
      - path: third_party/it4it/README.md
      - path: third_party/it4it/elements.yaml
      - path: third_party/it4it/relationships.yaml
      - path: third_party/it4it/views.yaml

  - name: oscal-compliance
    title: OSCAL Compliance Content
    description: The vendored OSCAL/FedRAMP reference content, the compliance-trestle dependency, and how they feed the platform's compliance-automation vision (ADR-0030).
    sources:
      - path: third_party/README.md
      - path: third_party/oscal*/**
      - path: third_party/fedramp-automation/**
      - path: pyproject.toml
      - path: sample-data/oscal/**
      - path: docs/adr/0030-vendor-oscal-reference-content.md

  - name: data-model
    title: Data Model
    description: Domain entities, the Neo4j schema, and the ArchiMate XSD basis.
    sources:
      - path: data-model.md
      - path: specs/002-neo4j-schema-ui/data-model.md
      - path: sample-data/schema/*.xsd

  - name: platform-spec
    title: Platform Specification & API
    description: The governance-platform and Neo4j schema-UI feature specs and API contracts.
    sources:
      - path: specs/001-governance-platform/spec.md
      - path: specs/001-governance-platform/contracts/**
      - path: specs/002-neo4j-schema-ui/spec.md
      - path: specs/002-neo4j-schema-ui/plan.md
      - path: specs/002-neo4j-schema-ui/research.md
      - path: specs/002-neo4j-schema-ui/contracts/api.md

  - name: non-functionals
    title: Non-Functional Requirements
    description: Performance, security, operability, and other cross-cutting constraints.
    sources:
      - path: NONFUNCTIONALS.md

  - name: visualizer-service
    title: Visualizer Service
    description: The FastAPI schema-visualiser service — API, caching, data loading.
    sources:
      - path: src/frictionless_architect/visualizer/*.py
      - path: src/frictionless_architect/schema/*.py

  - name: development
    title: Development & Quickstart
    description: How to set up, run, and work in this repo.
    sources:
      - path: quickstart.md
      - path: AGENTS.md
      - path: RELEASE.md
      - path: specs/002-neo4j-schema-ui/quickstart.md

  - name: sample-data
    title: Sample Data
    description: The bundled ArchiMate/OSCAL sample models and what each set demonstrates.
    sources:
      - path: sample-data/**/*.puml
      - path: sample-data/**/*.csv

  - name: agent-workflows
    title: Agent Skills & Workflows
    description: The repo's coding-agent skills and paired agents.
    sources:
      - path: .claude/skills/README.md
      - path: .claude/skills/commit-message/SKILL.md
      - path: .claude/skills/diagram-archimate/SKILL.md
      - path: .claude/skills/diagram-c4/SKILL.md
      - path: .claude/skills/diagram-plantuml/SKILL.md
      - path: .claude/skills/fork-sync/SKILL.md
      - path: .claude/skills/model-archimate/SKILL.md
      - path: .claude/skills/wiki-editor/SKILL.md
      - path: .claude/skills/wiki-librarian/SKILL.md
      - path: .claude/skills/speckit-*/SKILL.md
      - path: .claude/agents/*.md
