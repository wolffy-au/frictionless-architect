      - path: architecture/model/import_gh_roadmap.py

  - name: architecture-diagrams
    title: "Architecture Views & Diagrams: Vision, Business & Viewpoints"
    description: How the model's vision and business ArchiMate views map to standard viewpoints, the GH #105 generic per-viewpoint views, and the include_types/exclude_elements scoping mechanism.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/views.yaml
      - path: architecture/model/views-viewpoints.yaml
      - path: architecture/model/diagrams/vision/**
      - path: architecture/model/diagrams/business/**
      - path: architecture/model/diagrams/application/**
      - path: architecture/model/diagrams/layered/**
      - path: architecture/model/diagrams/c4/**
