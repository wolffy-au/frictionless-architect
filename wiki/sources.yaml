# wiki/sources.yaml — declares what the project wiki is built from.
#
# Edit THIS file; everything else under wiki/ is generated by the
# `wiki-librarian` skill and will be overwritten on rebuild.
#
# Each topic becomes wiki/<name>.md. A source is either:
#   - path: <glob>     a repo file or glob, relative to the repo root ('**' ok)
#   - url:  <url>       an external document, fetched and cached at build time
#     title: <text>
#
# After editing, run the librarian to (re)build, then:
#   python .claude/skills/wiki-librarian/tools/build_status.py --coverage

topics:
  - name: project-overview
    title: Project Overview
    description: What Frictionless Architect is, who it's for, and its scope.
    sources:
      - path: README.md
      - path: specs/EPIC-001-governance-platform/spec.md

  - name: governance-and-constitution
    title: Governance & Constitution
    description: The project's constitutional rules and quality gates.
    sources:
      - path: .specify/memory/constitution.md

  - name: architecture
    title: Architecture Overview
    description: How the platform is layered and migrated, and the technical standards. Decisions are on the decision-log page.
    sources:
      - path: ARCHITECTURE.md
      - path: TECHNICAL.md

  - name: decision-log
    title: Architecture Decision Log
    description: The ADR log — one MADR-lite file per load-bearing decision, with status and consequences.
    sources:
      - path: docs/adr/*.md

  - name: architecture-model
    title: Architecture Model
    description: The canonical graph-loadable YAML model — file layout, schema, build pipeline, and IT4IT alignment — that every ArchiMate/C4 diagram is generated from. Layer contents are on the per-layer pages.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/elements.yaml
      - path: architecture/model/relationships.yaml
      - path: architecture/model/views.yaml
      - path: architecture/model/views-viewpoints.yaml
      - path: architecture/model/build.py
      - path: platform/packages/modelling-specification/src/modelling_specification/cli.py
      - path: platform/packages/modelling-specification/src/modelling_specification/model_io.py
      - path: platform/packages/modelling-specification/src/modelling_specification/rendering.py

  - name: architecture-model-skeleton
    title: "Architecture Model: Skeleton"
    description: Section A of the model — the Motivation, Strategy and Business elements that carry the load-bearing skeleton.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/elements.yaml
      - path: architecture/model/relationships.yaml

  - name: architecture-model-ecosystem
    title: "Architecture Model: Ecosystem"
    description: Section B of the model — the application-layer six-subsystem ecosystem behind the C4 context/container views.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/elements.yaml
      - path: architecture/model/relationships.yaml

  - name: architecture-model-artefact-flow
    title: "Architecture Model: Artefact Flow"
    description: Section C of the model — the application-layer input/output pipeline of functions and artefacts, including the OSCAL chain.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/elements.yaml
      - path: architecture/model/relationships.yaml

  - name: architecture-model-migration
    title: "Architecture Model: Packaging, Migration & Technology"
    description: Sections E and F of the model — the platform's own packaging/migration restructure and its first Technology-layer cut — split out once Architecture Model passed ~500 lines.
    sources:
      - path: architecture/model/README.md
      - path: architecture/model/elements.yaml
      - path: architecture/model/relationships.yaml
      - path: architecture/model/views.yaml

  - name: gh-roadmap-layer
    title: "GitHub Roadmap Layer"
    description: How GitHub milestones, issues and releases are imported into the Implementation & Migration layer (spec 003, ADR-0035).
    sources:
